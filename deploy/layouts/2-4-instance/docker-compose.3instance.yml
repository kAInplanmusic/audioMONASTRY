# audioMONASTRY 3-Instance Layout
# Node A: app + master
# Node B: sfu + turn
# Node C: edge monitoring
#
# Deploy:
# Node A: docker compose -f docker-compose.hetzner.yml -f docker-compose.overrides.app.yml up -d caddy audiomonastry master-player
# Node B: docker compose -f docker-compose.hetzner.yml -f docker-compose.sfu.yml -f docker-compose.turn.yml -f docker-compose.overrides.sfu.yml up -d caddy audiomonastry coturn
# Node C: docker compose -f docker-compose.hetzner.yml -f docker-compose.monitoring.yml up -d node-exporter cadvisor prometheus alertmanager grafana
#
# Redis optional for multi-instance signaling. If used, deploy redis on Node A with --profile fleet.

name: audiomonastry

services:
  # App node
  audiomonastry-app:
    image: audiomonastry:hetzner
    container_name: audiomonastry-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      ENABLE_SFU: "0"
      MASTER_PLAYER_URL: http://master-player:8000
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "8080:8080"
    networks:
      - audiomonastry_net

  master-player:
    image: audiomonastry-master-player:hetzner
    container_name: audiomonastry-master
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - audiomonastry_net

  # SFU node
  audiomonastry-sfu:
    image: audiomonastry:hetzner
    container_name: audiomonastry-sfu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      ENABLE_SFU: "1"
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-}
      SFU_RTC_MIN_PORT: 40000
      SFU_RTC_MAX_PORT: 40099
    ports:
      - "8080:8080"
      - "40000-40099:40000-40099/udp"
      - "40000-40099:40000-40099/tcp"
    networks:
      - audiomonastry_net

  # Edge monitoring
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: audiomonastry-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: audiomonastry-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
    expose:
      - "8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: audiomonastry-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: audiomonastry-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  audiomonastry_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
