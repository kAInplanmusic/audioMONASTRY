<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="audioMONASTRY">
<meta name="theme-color" content="#050a14">
<title>audioMONASTRY Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kopf (Logo + 16 Kacheln) · Masterplayer (nur Ansicht) · mixerMONK (Hardware-Pult) · 15 Plugin-Streifen in Kopfreihenfolge · aiMONK + perforMONK.
   Dunkles Studio-Thema mit Neon-Konturen nach den Betreiber-Vorlagen (bewusst nur dunkel). Modulfarben aus docs/UI_SPEC.md. */
:root{
  color-scheme:dark;
  --bg:#050a14; --pn:#0a1222; --pn2:#070e1b; --pn3:#101c33; --ln:#16264a; --ln2:#24406f; --glow:rgba(70,130,255,.10);
  --tx:#d5e2fb; --dm:#6d84ad; --dm2:#445a82;
  --free:rgba(61,220,132,.32); --lock:rgba(170,22,34,.6);
  --ok:#3ddc84; --warn:#ffb703; --hot:#ff4d4d; --cue:#4cc9f0;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:Barlow,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx)}
body{margin:0;font:14px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;background:radial-gradient(1200px 600px at 50% -10%,#0d1a3a 0,transparent 60%),var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:8px 40px;display:flex;flex-direction:column;gap:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10px/1.1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dm)}
.hint{color:var(--dm);font-size:12px}
.box{background:linear-gradient(180deg,#0b1426,#070e1c);border:1px solid var(--ln2);border-radius:var(--r);box-shadow:0 0 0 1px rgba(80,140,255,.05),0 0 24px -12px rgba(80,140,255,.35),inset 0 0 30px rgba(40,90,200,.04)}

/* Demo-Leiste */
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;border:1px dashed var(--ln2);border-radius:var(--r);color:var(--dm);font-size:12px}
.demo b{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--tx)}
.dbtn{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:12px}
.dbtn.on{border-color:var(--u,#fff);box-shadow:0 0 0 1px var(--u,#fff) inset}
.dbtn.go{background:var(--ok);color:#04140b;border-color:var(--ok);font-weight:600}
.dbtn:disabled{opacity:.4}
.demo .sp{flex:1}
.eng{font:600 11px var(--f-disp);letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--ln2);color:var(--dm);white-space:nowrap}
.eng.run{color:var(--ok);border-color:rgba(61,220,132,.5)}

/* Kopf */
.top{display:flex;flex-direction:column;gap:8px}
@media (min-width:1000px){.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 4px}}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:62px;height:62px;border-radius:10px;border:1px solid var(--ln2);box-shadow:0 0 18px -4px rgba(120,80,255,.6);object-fit:cover}
.brand b{display:block;font:700 19px/1 var(--f-disp)}
.brand b span{color:var(--cue)}
.brand small{display:block;font:500 11px var(--f-body);color:var(--dm);margin-top:4px}
.ics{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;min-width:0;max-width:640px;justify-self:center;width:100%}
.ic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:46px;background:linear-gradient(#0b1528,#08101e);border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:9px;color:var(--c);font:600 10px var(--f-body);padding:2px;min-width:0;transition:box-shadow .2s}
.ic svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic.free{box-shadow:0 0 12px 1px var(--free)}
.ic.lock{box-shadow:0 0 12px 2px var(--lock)}
.ic.mine{box-shadow:0 0 0 2px var(--u),0 0 12px var(--u)}
.hr{display:flex;align-items:center;gap:10px}
.users{display:flex;align-items:center;gap:4px}
.udot{width:15px;height:15px;border-radius:50%;background:var(--u);display:inline-block;flex:none;box-shadow:0 0 8px var(--u)}
.udot.away{background:none;border:1.5px dashed var(--dm2);box-shadow:none}
.gear{width:36px;height:36px;border-radius:50%;background:var(--pn2);border:1px solid var(--ln2);display:grid;place-items:center}
.gear svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:1.7}
#hscope{width:90px;height:34px}
@media (max-width:999px){.head{grid-template-columns:minmax(0,1fr) auto}.ics{grid-column:1/-1;grid-row:2;max-width:none}#hscope{display:none}}

/* Masterplayer */
.mp{display:grid;grid-template-columns:200px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 12px}
.mpt b{display:block;font:700 15px var(--f-disp)}
.mpt small{display:block;color:var(--dm);font-size:12px}
.mpt .tag{display:inline-block;margin-top:5px;font:600 9px var(--f-disp);letter-spacing:.12em;color:var(--cue);border:1px solid rgba(76,201,240,.4);border-radius:4px;padding:1px 5px}
.mpw{height:70px;min-width:0}
.mpw canvas{width:100%;height:100%;display:block}
.mpi{display:grid;grid-template-columns:auto auto auto;gap:4px 18px;margin:0}
.mpi div{min-width:0}
.mpi dt{font:600 9px var(--f-disp);letter-spacing:.12em;color:var(--dm);text-transform:uppercase}
.mpi dd{margin:0;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mpi dd.big{font-size:22px}
.lrw{display:flex;gap:4px;align-items:stretch;height:70px}
.lrw .sc{display:flex;flex-direction:column;justify-content:space-between;font:500 8px var(--f-mono);color:var(--dm);text-align:right}
@media (max-width:900px){.mp{grid-template-columns:minmax(0,1fr) auto}.mpt{grid-column:1/-1}.mpw{grid-column:1}.lrw{grid-column:2;grid-row:2}.mpi{grid-column:1/-1}}

/* Pegel */
.vm{position:relative;width:6px;height:100%;background:#03060c;border-radius:2px;overflow:hidden;border:1px solid #0e1a33}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ok) 0,var(--ok) 60%,var(--warn) 80%,var(--hot) 100%);background-size:100% var(--h,70px)}
.vm b{position:absolute;left:0;right:0;height:2px;background:#fff;opacity:.75;bottom:0}
.seg10{display:flex;flex-direction:column-reverse;gap:2px;height:100%;width:8px}
.seg10 i{flex:1;background:#0b1428;border-radius:1px}
.seg10 i.on{background:var(--ok)}.seg10 i.on.w{background:var(--warn)}.seg10 i.on.h{background:var(--hot)}

/* Plugin-Streifen */
.st{position:relative;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:7px 12px;min-height:46px;border-bottom:1px solid transparent}
.st.open .sh{border-bottom-color:var(--ln)}
.mk{width:22px;height:22px;flex:none}
.mk path{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.nm h2{margin:0;font:700 15px/1.1 var(--f-disp);color:var(--c);white-space:nowrap}
.nm h2 i{font-style:normal;color:var(--dm);margin-right:6px;font-family:var(--f-mono);font-size:13px}
.nm h2 em{font-style:normal;color:var(--tx)}
.chips3{display:inline-flex;gap:3px}
.chips3 span{font:700 9px var(--f-disp);letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px solid var(--ln2);color:var(--dm2)}
.chips3 span.on{color:#06101c;background:var(--c);border-color:var(--c)}
.chips3 span.on.st2{background:none;color:var(--c);border-color:var(--c)}
.chips3 span.on.off{background:none;color:var(--tx);border-color:var(--dm)}
.lk{width:15px;height:15px;stroke:var(--dm);fill:none;stroke-width:2;flex:none}
.lk.red{stroke:var(--u)}
.who{font-size:12px;color:var(--dm);display:inline-flex;gap:5px;align-items:center}
.vb{font:500 10px var(--f-mono);color:var(--dm2);border:1px solid var(--ln);border-radius:5px;padding:1px 5px;white-space:nowrap}
.pw{min-width:70px;height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--dm2);background:none;color:var(--dm);display:inline-flex;gap:6px;align-items:center;justify-content:center;font:700 11px var(--f-disp);letter-spacing:.08em;flex:none}
.pw svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pw.stby{border-color:var(--c);color:var(--c)}
.pw.on{background:var(--c);border-color:var(--c);color:#06101c}
.pw.run{animation:glow 1.6s ease-in-out infinite}
.pw.tk{border-color:var(--u);color:var(--u);opacity:.85}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--c)}50%{box-shadow:0 0 16px 3px var(--c)}}
.smeter{display:flex;gap:2px;height:28px;flex:none}
.smeter .vm{width:5px}
.sb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.sum{padding:0 12px 10px 44px;font-size:12px;color:var(--dm)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.row.c{align-items:center}
.card{background:linear-gradient(180deg,#0a1426,#070f1e);border:1px solid color-mix(in srgb,var(--c) 28%,var(--ln));border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:inset 0 0 18px rgba(40,90,200,.05)}
.card h3{margin:0;font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--tx);display:flex;align-items:center;gap:7px;justify-content:space-between}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);flex:none}
.card h3>span:first-child{display:flex;align-items:center;gap:7px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.knobs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-start;justify-content:center}
.arrow{color:var(--dm2);font:600 16px var(--f-mono);align-self:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.disp{width:100%;height:58px;display:block;background:#040912;border:1px solid #10204a;border-radius:7px}
.list{display:flex;flex-direction:column;gap:2px;min-width:130px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:12px;color:var(--dm);text-align:left}
.list button.on{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent);color:var(--tx)}
.list button i{font-style:normal;color:var(--dm2)}

/* Bedienelemente */
.kn{display:inline-flex;flex-direction:column;align-items:center;width:46px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;border-radius:6px}
.kn svg{width:36px;height:36px;display:block}
.kn .kb{fill:none;stroke:#13203e;stroke-width:3;stroke-linecap:round}
.kn .ka{fill:none;stroke:var(--c,var(--cue));stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--c,var(--cue)))}
.kn .kc{fill:url(#kg);stroke:#2c3a55;stroke-width:1}
.kn .ki{stroke:#f2f6ff;stroke-width:2.2;stroke-linecap:round}
.kn b{font:600 10px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--tx);line-height:1.1;margin-top:1px;white-space:nowrap}
.kn i{font:600 9px var(--f-disp);letter-spacing:.06em;font-style:normal;color:var(--dm);text-transform:uppercase;white-space:nowrap;line-height:1.1}
.kn.s{width:48px}.kn.s svg{width:30px;height:30px}
.kn.xs{width:32px}.kn.xs svg{width:24px;height:24px}.kn.xs b{font-size:9px}
.kn.l{width:60px}.kn.l svg{width:50px;height:50px}
.kn.gold .ka{stroke:#ffb347;filter:drop-shadow(0 0 3px #ffb347)}
.tg{background:var(--pn2);border:1px solid var(--ln2);border-radius:6px;padding:3px 8px;font:700 10px var(--f-disp);letter-spacing:.06em;color:var(--dm);min-width:28px}
.tg.on{border-color:var(--c,var(--cue));color:var(--c,var(--cue));box-shadow:0 0 8px -2px var(--c,var(--cue))}
.tg.m.on{color:var(--warn);border-color:var(--warn);box-shadow:0 0 8px -2px var(--warn)}
.tg.s.on{color:var(--ok);border-color:var(--ok);box-shadow:0 0 8px -2px var(--ok)}
.tg.cue.on{color:#06101c;background:var(--warn);border-color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:7px;overflow:hidden;background:var(--pn2)}
.seg button{background:none;border:0;padding:4px 8px;font:700 10px var(--f-disp);letter-spacing:.05em;color:var(--dm)}
.seg button+button{border-left:1px solid var(--ln)}
.seg button.on{background:var(--c,var(--cue));color:#06101c}
.sel{background:var(--pn2);border:1px solid var(--ln2);border-radius:7px;padding:5px 8px;font-size:12px;max-width:100%}
.btn{background:var(--pn3);border:1px solid var(--ln2);border-radius:8px;padding:6px 12px;font:600 12px var(--f-body)}
.btn.pri{background:var(--c,var(--cue));border-color:var(--c,var(--cue));color:#06101c}
.btn.big{padding:12px 18px;font:700 14px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,rgba(255,60,160,.25),rgba(255,60,160,.08));border:1.5px solid #ff4fa8;color:#ffd1ea;box-shadow:0 0 18px -4px #ff4fa8}
.btn:disabled{opacity:.45}
.txt{width:100%;background:var(--pn2);border:1px solid var(--ln2);border-radius:8px;padding:8px 10px;resize:vertical;min-height:38px}
.fd{position:relative;width:28px;height:118px;touch-action:none;cursor:ns-resize;border-radius:4px}
.fd .fdt{position:absolute;left:12px;width:4px;top:6px;bottom:6px;background:#02050b;border:1px solid var(--ln);border-radius:2px}
.fd .fdk{position:absolute;left:1px;width:26px;height:16px;bottom:calc(var(--n,0) * (100% - 16px));border-radius:3px;background:linear-gradient(#e8edf5,#9aa6bb 45%,#59647a 55%,#cfd6e2);border:1px solid #2a3348;box-shadow:0 3px 5px rgba(0,0,0,.7)}
.fd .fdk::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2px;background:#111}
.fd.big{height:150px}
.fh{position:relative;height:34px;flex:1;min-width:120px;touch-action:none;cursor:ew-resize}
.fh .fdt{position:absolute;top:15px;height:4px;left:10px;right:10px;background:#02050b;border:1px solid var(--ln);border-radius:2px}
.fh .fdk{position:absolute;top:2px;width:20px;height:30px;left:calc(var(--n,0) * (100% - 20px));border-radius:4px;background:linear-gradient(90deg,#e8edf5,#9aa6bb 45%,#59647a 55%,#cfd6e2);border:1px solid #2a3348}
.fh .fdk::after{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:#111}
.bar{position:relative;height:12px;min-width:56px;flex:1;touch-action:none;cursor:ew-resize;background:#050a14;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.bar .fdt{position:absolute;inset:0;width:calc(var(--n,0) * 100%);background:repeating-linear-gradient(90deg,var(--bc,#8c5cff) 0 4px,transparent 4px 5px)}
.bar .fdk{display:none}

/* Mixer (Hardware-Pult) */
.mxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--ln)}
.bpm{display:inline-flex;align-items:center;gap:4px;background:var(--pn2);border:1px solid var(--ln2);border-radius:8px;padding:2px}
.bpm button{background:none;border:0;width:26px;height:26px;color:var(--dm);font-weight:700}
.bpm output{font:600 16px var(--f-mono);min-width:56px;text-align:center}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 12px;font-size:11px;color:var(--dm);border-bottom:1px solid var(--ln)}
.chain button{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:2px 7px;font:600 10px var(--f-disp);color:var(--dm2)}
.chain button.on{color:var(--tx);border-color:var(--c);box-shadow:0 0 8px -3px var(--c)}
.chain .stg{font:600 9px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dm2);margin-left:4px}
.hand{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--ln)}
.desk{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:linear-gradient(180deg,#0c1220,#090e19)}
.unit{background:linear-gradient(180deg,#161c28,#0d121c);border:1px solid #232c3d;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 14px rgba(0,0,0,.5);padding:8px}
.rail{display:flex;flex-direction:column;gap:6px;align-items:center;width:62px}
.rail .rb{width:46px;height:26px;border-radius:6px;background:#0a0f18;border:1px solid #2a3446;font:700 9px var(--f-disp);letter-spacing:.06em;color:#9fb0cf}
.ring{width:48px;height:48px;border-radius:50%;border:3px solid var(--rc);background:#0a0f18;font:700 9px var(--f-disp);color:var(--tx);box-shadow:0 0 12px -2px var(--rc),inset 0 0 10px rgba(0,0,0,.6);line-height:1.1}
.ring.off{opacity:.45;box-shadow:none}
.deck{display:flex;flex-direction:column;gap:8px;width:250px}
.screen{background:#04070d;border:1px solid #1e2a40;border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px}
.screen .ttl{display:flex;justify-content:space-between;gap:6px;font:600 10px var(--f-mono);color:#ff8a3d}
.screen .ttl span:last-child{color:var(--cue)}
.screen canvas{width:100%;height:46px;display:block}
.screen .inf{display:flex;justify-content:space-between;font:600 12px var(--f-mono)}
.dbtns{display:flex;gap:6px}
.dbtns button{flex:1;height:30px;border-radius:6px;background:#0a0f18;border:1px solid #2a3446;font:700 11px var(--f-disp);color:var(--tx)}
.dbtns button.on{border-color:var(--cue);color:var(--cue);box-shadow:0 0 8px -2px var(--cue)}
.jog{position:relative;width:200px;height:200px;margin:0 auto;touch-action:none;cursor:grab}
.jog canvas{width:100%;height:100%;display:block}
.deckfoot{display:flex;justify-content:space-between;align-items:center}
.db{width:56px;height:56px;border-radius:50%;border:2px solid var(--bk);background:radial-gradient(#1a2335,#0a0f18);font:700 13px var(--f-disp);color:var(--bk);box-shadow:0 0 14px -2px var(--bk)}
.mcol{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px}
.mcol .mf{display:flex;gap:4px;align-items:stretch}
.mcol .mf .vm{width:7px}
.mcol .ab{display:flex;gap:4px}
.mcol .ab button{width:34px;height:28px;border-radius:5px;background:#0a0f18;border:1px solid #2a3446;font:700 12px var(--f-disp);color:var(--tx)}
.chans{display:flex;gap:6px}
.cs{width:100px;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#11161f),#0b0f17 40%);border:1px solid #232c3d;border-radius:8px;padding:0 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden}
.cs .chd{width:calc(100% + 8px);background:var(--c);color:#0a0e16;text-align:center;font:700 15px var(--f-disp);padding:3px 0 1px;box-shadow:0 0 14px -2px var(--c)}
.cs .cnm{font:600 12px var(--f-body);color:var(--tx);text-align:center;line-height:1.1}

 const strs=tun.map((_,i)=>`<i class="str" style="top:${(i+.5)/n*100}%;height:${kind==='guitar'?1.5+(n-1-i)*.5:2+(n-1-i)*.7}px"></i>`).join('');
