<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="audioMONASTRY">
<meta name="theme-color" content="#080c14">
<title>audioMONASTRY Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: feste Kopfzeile + Masterplayer, darunter der Mixer, dann die 15 Plugins in Kopfreihenfolge, unten perfMONK/aiMONK.
   Ein dunkles Studio-Thema (bewusst nur dunkel). Farben aus docs/UI_SPEC.md. */
:root{
  color-scheme:dark;
  --bg:#080c14; --pn:#101826; --pn2:#0b111c; --pn3:#141e30; --ln:#1e2a40; --ln2:#2a3956;
  --tx:#d9e2f2; --dm:#6f7f9d; --dm2:#4a5876;
  --free:rgba(61,220,132,.30); --lock:rgba(170,22,34,.55);
  --ok:#3ddc84; --warn:#ffb703; --hot:#ff4d4d; --cue:#4cc9f0;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:Barlow,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx)}
body{margin:0;font:14px/1.4 var(--f-body);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:8px 40px;display:flex;flex-direction:column;gap:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dm)}
.hint{color:var(--dm);font-size:12px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r)}

/* Demo-Leiste (nur Prototyp) */
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px dashed var(--ln2);border-radius:var(--r);color:var(--dm);font-size:12px}
.demo b{font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--tx)}
.dbtn{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:12px}
.dbtn.on{border-color:var(--u,#fff);box-shadow:0 0 0 1px var(--u,#fff) inset}
.dbtn.go{background:var(--ok);color:#04140b;border-color:var(--ok);font-weight:600}
.dbtn:disabled{opacity:.4}
.demo .sp{flex:1}

/* Kopf */
.top{display:flex;flex-direction:column;gap:8px}
@media (min-width:900px){.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 4px}}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:8px 12px}
.logo{font:700 18px/1 var(--f-disp);letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--cue)}
.logo small{display:block;font:500 10px var(--f-body);color:var(--dm);letter-spacing:.04em;margin-top:3px}
.ics{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:6px;min-width:0}
.ic{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:var(--dm);font:600 9px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.ic i{display:grid;place-items:center;width:100%;max-width:46px;aspect-ratio:1/0.9;border-radius:10px;background:var(--pn2);border:1px solid var(--ln);transition:box-shadow .2s}
.ic svg{width:22px;height:22px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.free i{box-shadow:0 0 12px 1px var(--free)}
.ic.lock i{box-shadow:0 0 12px 2px var(--lock)}
.ic.mine i{box-shadow:0 0 0 2px var(--u),0 0 12px var(--u)}
.ic span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.users{display:flex;align-items:center;gap:6px}
.udot{width:14px;height:14px;border-radius:50%;background:var(--u);display:inline-block;flex:none}
.udot.away{background:none;border:1.5px dashed var(--dm2)}
.gear{width:34px;height:34px;border-radius:50%;background:var(--pn2);border:1px solid var(--ln);display:grid;place-items:center}
.gear svg{width:18px;height:18px;stroke:var(--dm);fill:none;stroke-width:1.7}
@media (max-width:899px){.head{grid-template-columns:1fr auto}.ics{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(8,minmax(0,1fr))}}

/* Masterplayer: nur Ansicht */
.mp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 12px}
.mpw{position:relative;height:54px;min-width:0}
.mpw canvas{width:100%;height:100%;display:block}
.mptag{position:absolute;left:6px;top:2px;font:600 9px var(--f-disp);letter-spacing:.12em;color:var(--dm);text-transform:uppercase}
.mpi{display:flex;gap:14px;margin:0}
.mpi div{text-align:center}
.mpi dt{font:600 9px var(--f-disp);letter-spacing:.12em;color:var(--dm);text-transform:uppercase}
.mpi dd{margin:2px 0 0;font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.lr{display:flex;gap:3px;align-items:flex-end;height:54px}
.eng{font:600 11px var(--f-disp);letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--ln2);color:var(--dm);white-space:nowrap}
.eng.run{color:var(--ok);border-color:rgba(61,220,132,.5)}
@media (max-width:760px){.mp{grid-template-columns:1fr auto;grid-template-areas:'w l' 'i i'}.mpw{grid-area:w}.lr{grid-area:l}.mpi{grid-area:i;justify-content:space-between}.mpi dd{font-size:14px}}
.hand{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 12px 8px 56px}

/* Pegelanzeige */
.vm{position:relative;width:6px;height:100%;background:#060a12;border-radius:2px;overflow:hidden}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ok) 0,var(--ok) 62%,var(--warn) 82%,var(--hot) 100%);background-size:100% var(--h,100px);background-position:bottom}
.vm b{position:absolute;left:0;right:0;height:2px;background:#fff;opacity:.7;bottom:0}

/* Modulstreifen */
.grp{display:flex;align-items:center;gap:8px;padding:4px 2px 0}
.grp::after{content:"";flex:1;height:1px;background:var(--ln)}
.st{position:relative;overflow:hidden}
.st::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c);opacity:.85}
.sh{display:flex;align-items:center;gap:10px;padding:9px 12px;min-height:52px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 45%)}
.sicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--pn2);border:1px solid color-mix(in srgb,var(--c) 45%,var(--ln));flex:none}
.sicon svg{width:19px;height:19px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nm{flex:1;min-width:0}
.nm h2{margin:0;font:700 15px/1.1 var(--f-disp);letter-spacing:.02em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.nm h2 em{font-style:normal;color:var(--c)}
.nm h2 small{font:500 12px var(--f-body);color:var(--dm);letter-spacing:0}
.nm p{margin:2px 0 0;font-size:12px;color:var(--dm);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vb{font:500 10px var(--f-mono);color:var(--dm2);border:1px solid var(--ln);border-radius:5px;padding:1px 5px}
.pw{min-width:74px;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--dm2);background:none;color:var(--dm);display:inline-flex;gap:6px;align-items:center;justify-content:center;font:700 11px var(--f-disp);letter-spacing:.08em;flex:none}
.pw svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.pw.stby{border-color:var(--c);color:var(--c)}
.pw.on{background:var(--c);border-color:var(--c);color:#06101c}
.pw.run{animation:glow 1.6s ease-in-out infinite}
.pw.tk{border-color:var(--u);color:var(--u);opacity:.8}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--c)}50%{box-shadow:0 0 16px 3px var(--c)}}
.sb{padding:4px 12px 14px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
.sum{padding:0 12px 10px 56px;font-size:12px;color:var(--dm)}

/* Bedienelemente */
.kn{display:inline-flex;flex-direction:column;align-items:center;width:46px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;outline-offset:1px;border-radius:6px}
.kn svg{width:36px;height:36px;display:block}
.kn .kt{fill:#0a1019;stroke:#1b263a;stroke-width:6}
.kn .kb{fill:none;stroke:#1b263a;stroke-width:3;stroke-linecap:round}
.kn .ka{fill:none;stroke:var(--c,var(--cue));stroke-width:3;stroke-linecap:round}
.kn .kc{fill:url(#kg);stroke:#2c3a55;stroke-width:1}
.kn .ki{stroke:var(--c,var(--cue));stroke-width:2.2;stroke-linecap:round}
.kn b{font:600 10px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--tx);line-height:1.1;margin-top:1px;white-space:nowrap}
.kn i{font:600 9px var(--f-disp);letter-spacing:.06em;font-style:normal;color:var(--dm);text-transform:uppercase;white-space:nowrap;line-height:1.1}
.kn.s{width:40px}.kn.s svg{width:30px;height:30px}
.kn.xs{width:32px}.kn.xs svg{width:24px;height:24px}.kn.xs b{font-size:9px}
.kn.l{width:58px}.kn.l svg{width:48px;height:48px}
.tg{background:var(--pn2);border:1px solid var(--ln2);border-radius:6px;padding:3px 8px;font:700 10px var(--f-disp);letter-spacing:.06em;color:var(--dm);min-width:28px}
.tg.on{border-color:var(--c,var(--cue));color:var(--c,var(--cue));box-shadow:0 0 8px -2px var(--c,var(--cue))}
.tg.m.on{color:var(--warn);border-color:var(--warn);box-shadow:0 0 8px -2px var(--warn)}
.tg.s.on{color:var(--ok);border-color:var(--ok);box-shadow:0 0 8px -2px var(--ok)}
.tg.cue.on{color:var(--cue);border-color:var(--cue)}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:7px;overflow:hidden;background:var(--pn2)}
.seg button{background:none;border:0;padding:4px 8px;font:700 10px var(--f-disp);letter-spacing:.05em;color:var(--dm)}
.seg button+button{border-left:1px solid var(--ln)}
.seg button.on{background:var(--c,var(--cue));color:#06101c}
.sel{background:var(--pn2);border:1px solid var(--ln2);border-radius:7px;padding:5px 8px;font-size:12px;max-width:100%}
.btn{background:var(--pn3);border:1px solid var(--ln2);border-radius:8px;padding:6px 12px;font:600 12px var(--f-body)}
.btn.pri{background:var(--c,var(--cue));border-color:var(--c,var(--cue));color:#06101c}
.btn:disabled{opacity:.45}
.txt{width:100%;background:var(--pn2);border:1px solid var(--ln2);border-radius:8px;padding:8px 10px;resize:vertical;min-height:38px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row.c{align-items:center}
.card{background:var(--pn2);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font:700 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:8px;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.knobs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-start}
.arrow{color:var(--dm2);font:600 16px var(--f-mono);align-self:center}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.fd{position:relative;width:28px;height:128px;touch-action:none;cursor:ns-resize;border-radius:4px}
.fd .fdt{position:absolute;left:12px;width:4px;top:6px;bottom:6px;background:#04070d;border:1px solid var(--ln);border-radius:2px}
.fd .fdk{position:absolute;left:1px;width:26px;height:14px;bottom:calc(var(--n,0) * (100% - 14px));border-radius:3px;background:linear-gradient(#3b4b68,#1a2335);border:1px solid #4a5d80;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.fd .fdk::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:var(--c,#fff)}
.fh{position:relative;height:34px;flex:1;min-width:140px;touch-action:none;cursor:ew-resize}
.fh .fdt{position:absolute;top:15px;height:4px;left:10px;right:10px;background:#04070d;border:1px solid var(--ln);border-radius:2px}
.fh .fdk{position:absolute;top:2px;width:20px;height:30px;left:calc(var(--n,0) * (100% - 20px));border-radius:4px;background:linear-gradient(90deg,#3b4b68,#1a2335);border:1px solid #4a5d80}
.fh .fdk::after{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:#fff}

/* Mixer */
.mxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--ln)}
.bpm{display:inline-flex;align-items:center;gap:4px;background:var(--pn2);border:1px solid var(--ln2);border-radius:8px;padding:2px}
.bpm button{background:none;border:0;width:26px;height:26px;color:var(--dm);font-weight:700}
.bpm output{font:600 16px var(--f-mono);min-width:56px;text-align:center}
.bank{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid var(--ln2)}
.bank button{border:0;padding:5px 12px;font:700 12px var(--f-disp);letter-spacing:.06em;background:var(--pn2);color:var(--dm)}
.bank button.on.a{background:var(--cue);color:#04121b}
.bank button.on.b{background:var(--warn);color:#1b1200}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 12px 8px;font-size:11px;color:var(--dm)}
.chain button{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:2px 7px;font:600 10px var(--f-disp);letter-spacing:.04em;color:var(--dm2)}
.chain button.on{color:var(--tx);border-color:var(--c);box-shadow:0 0 8px -3px var(--c)}
.chain .stg{font:600 9px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dm2);margin-left:4px}
.console{display:flex;gap:10px;padding:6px 12px 10px;align-items:stretch;flex-wrap:wrap}
.chans{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:4px}
.cs{width:94px;flex:none;background:linear-gradient(#0d1420,#0a0f19);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:8px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.cs header{display:flex;gap:5px;align-items:baseline;justify-content:center;width:100%}
.cs.rt{width:76px;border-top-color:var(--c)}
.cs .cn{font:700 15px var(--f-mono);color:var(--c)}
.cs .cname{font:700 11px var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.cs .own{overflow-wrap:anywhere;font-size:10px;color:var(--dm);text-align:center;line-height:1.15;min-height:24px}
.cs .own b{color:var(--tx);font-weight:600}
.cs .sep{width:80%;height:1px;background:var(--ln)}
.cs .eq3{display:flex;flex-direction:column;gap:2px;align-items:center}
.cs .snd{display:grid;grid-template-columns:1fr 1fr;gap:0 2px}
.cs .r3{display:flex;gap:3px}
.cs .fz{display:flex;gap:5px;align-items:stretch;height:128px}
.cs .fz .vm{width:5px}
.cs .xf{display:flex;border:1px solid var(--ln2);border-radius:6px;overflow:hidden;width:100%}
.cs .xf button{flex:1;border:0;background:none;padding:3px 0;font:700 9px var(--f-disp);color:var(--dm)}
.cs .xf button.on{background:var(--c);color:#06101c}
.pp{display:flex;gap:4px;width:100%}
.pp button{flex:1;height:32px;border-radius:7px;border:1px solid var(--ln2);background:var(--pn3);font-size:14px;color:var(--dm)}
.pp .play.on{background:var(--ok);border-color:var(--ok);color:#04140b;animation:glowg 1.6s ease-in-out infinite}
.pp .stop.on{border-color:var(--hot);color:var(--hot)}
.pp button:disabled{opacity:.35}
@keyframes glowg{0%,100%{box-shadow:0 0 3px var(--ok)}50%{box-shadow:0 0 14px 2px var(--ok)}}
.msec{flex:0 1 380px;min-width:250px;align-content:start;display:grid;grid-template-columns:auto auto 1fr;gap:10px;background:linear-gradient(#0d1420,#0a0f19);border:1px solid var(--ln);border-top:3px solid #e6edf8;border-radius:8px;padding:8px}
.msec .mm{display:flex;gap:3px;height:150px}
.msec .mm .vm{width:9px}
.msec .col{display:flex;flex-direction:column;gap:6px;align-items:center}
.msec .info{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--dm)}
.msec .info b{display:block;font:600 14px var(--f-mono);color:var(--tx)}
.xfrow{display:flex;gap:10px;align-items:center;padding:4px 12px 10px;flex-wrap:wrap}
.xfrow .ab{font:700 14px var(--f-disp);color:var(--dm)}
.perf{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--ln)}
.pads{display:grid;grid-template-columns:repeat(4,44px);gap:6px}
.pad{width:44px;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:color-mix(in srgb,var(--pc) 35%,#0a0f19);font:700 9px var(--f-disp);color:rgba(255,255,255,.75);padding:2px;line-height:1.1;transition:background .08s, box-shadow .08s}
.pad.hit{background:var(--pc);box-shadow:0 0 14px var(--pc);color:#06101c}
.scn{display:grid;grid-template-columns:repeat(4,34px);gap:5px}
.scn button{height:30px;border-radius:6px;border:1px solid var(--ln2);background:var(--pn2);font:700 11px var(--f-mono);color:var(--dm)}
.scn button.has{color:var(--tx);border-color:var(--dm)}
.scn button.on{background:var(--c);color:#06101c;border-color:var(--c)}
.mini{display:flex;gap:8px;align-items:flex-end;height:40px;padding:0 12px 10px 56px}
.mini .mc{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 9px var(--f-mono);color:var(--dm)}
.mini .vm{height:26px;width:8px}

/* Drum-Raster */
.grid{display:grid;gap:3px;align-items:center;width:max-content}
.stp{width:var(--sw,26px);height:28px;border-radius:4px;border:1px solid var(--ln);background:#0a0f19;padding:0}
.stp.q{background:#0d1522}
.stp.v1{background:color-mix(in srgb,var(--c) 55%,#0a0f19);border-color:var(--c)}
.stp.v2{background:var(--c);border-color:#fff}
.stp.ph{outline:2px solid rgba(255,255,255,.55);outline-offset:-2px}
.tn{font:700 10px var(--f-disp);letter-spacing:.06em;color:var(--tx);white-space:nowrap}
.roll .stp{width:22px;height:16px;border-radius:3px}
.roll .tn{font:500 9px var(--f-mono);color:var(--dm);text-align:right;padding-right:4px}
.roll .tn.root{color:var(--c)}

/* Tastatur */
.kbd{position:relative;height:96px;display:flex;user-select:none;-webkit-user-select:none;touch-action:none}
.kbd .w{flex:1;min-width:24px;border:1px solid #2a3348;background:linear-gradient(#e8edf5,#c8d0de);border-radius:0 0 5px 5px;position:relative;font:600 9px var(--f-mono);color:#59647a;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.kbd .b{position:absolute;top:0;width:3.2%;min-width:15px;height:58%;background:linear-gradient(#232a38,#0b0e15);border-radius:0 0 4px 4px;z-index:2;border:1px solid #000}
.kbd .down{background:var(--c)!important}

/* Bibliothek */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font:600 9px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--dm);padding:4px 6px;border-bottom:1px solid var(--ln)}
.tbl td{padding:6px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tbl td.n{white-space:normal;min-width:160px}
.tbl .new{font:700 9px var(--f-disp);color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 4px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}

function scheduler(){
 if(!A||A.ctx.state!=='running')return;const c=A.ctx,now=performance.now();
 if(A.lastSched)A.late=Math.max(A.late*.97,now-A.lastSched-25);A.lastSched=now;
 if(A.next<c.currentTime)A.next=c.currentTime+.04;
 while(A.next<c.currentTime+.12){const st=S.step,t=A.next;tick(st,t);A.q.push({st,t});if(A.q.length>64)A.q.shift();
  const sw=V['drm.swing']||0;A.next+=sixteenth()*(st%2===0?1+sw:1-sw);S.step++}
}
const chOn=k=>S.play[k]&&modeOf(CH[k])==='on'&&A;
function tick(st,t){
 const s=st%16,bar=Math.floor(st/16);
 if(s===0&&S.play[1])songBar(t);
 if(chOn(0))dropTick(s,t);
 if(chOn(1))songTick(s,t);
 if(chOn(2))drumTick(s,t,bar);
 if(chOn(3))synTick(s,t);
 if(chOn(4))insTick(s,t);

  case 'SD':tone(190*r,170*r,.05,.12,lvl*.45,'triangle');nz('highpass',1500,.7,.2*decay,lvl*.6);return .2*decay;
  case 'CP':{const n=noise(c,t,.4*decay+.1),f=c.createBiquadFilter(),g=G(0);f.type='bandpass';f.frequency.value=1150*r;f.Q.value=1.4;

 <div class="card"><h3>Pad ${i+1} · ${DROPS[i][0]}</h3><div class="knobs">${K(`drp.${i}.pit`,'Tonhöhe',-12,12,0,{u:'st',step:1})}${K(`drp.${i}.lvl`,'Pegel',0,1,.6,{u:'pct'})}${K(`drp.${i}.len`,'Länge',.3,2,1,{u:'mul'})}</div>
 <div class="row c"><span class="lbl">Start</span>${SEG('drp.q',[['0','Sofort'],['4','1/4'],['16','1 Takt']],'4','Quantisierung')}</div>
 <p class="hint" style="margin:0">Tippen feuert das Pad und wählt es zum Bearbeiten. Ausgang: Kanal 1.</p></div></div>`};
BODY.song=()=>{const secs=S.song.sections;const total=songLen();return `<div class="row" style="align-items:stretch">
 <div class="card" style="flex:2;min-width:240px"><h3>Beschreibung</h3><textarea class="txt" id="songPrompt" rows="2" aria-label="Songbeschreibung">${esc(S.song.prompt||'Mönche singen über einem treibenden Techno-Beat, dunkel und weit')}</textarea>
 <div class="chips">${['Techno','House','Ambient','Dunkel','Hymnisch','Chor','Breakbeat','Filmisch'].map(t=>`<button class="chip ${S.song.tags.includes(t)?'on':''}" data-a="tag:${t}">${t}</button>`).join('')}</div>
 <div class="row c"><span class="lbl">Länge</span>${SEG('song.len',[['short','1:00'],['mid','2:00'],['long','3:30']],'mid')}<span class="hint">Tempo und Tonart folgen dem Projekt: ${S.bpm} BPM, ${keyName()}</span>
 <button class="btn pri" data-a="songgen" style="margin-left:auto">Song erzeugen</button></div></div>
 <div class="card" style="flex:1;min-width:180px"><h3>Takes</h3><div class="chips">${S.song.takes.length?S.song.takes.map((t,k)=>`<button class="chip ${k===S.song.take?'on':''}" data-a="take:${k}">${esc(t)}</button>`).join(''):'<span class="hint">Noch keine Takes. „Song erzeugen“ legt einen an und sichert ihn in der Bibliothek.</span>'}</div>
 <div class="knobs">${K('song.bri','Helligkeit',.2,1.4,1,{u:'pct'})}</div></div></div>
 <div class="card"><h3>Arrangement <span class="hint mono" id="songChord"></span></h3><div class="timeline">${secs.map(([n,b],k)=>`<button style="flex:${b}" data-a="sec:${k}" data-sec="${k}">${n} <span class="hint">${b} T.</span><i hidden></i></button>`).join('')}</div>
 <p class="hint" style="margin:0">${total} Takte · tippen springt zum Abschnitt · Akkorde: ${chordDegs().map(d=>['I','II','III','IV','V','VI','VII'][d]).join(' – ')}. Ausgang: Kanal 2.</p></div>`};
BODY.effect=()=>{const slot=(z,title,inner)=>`<div class="card"><h3>${title} ${T(`fx.${z}.on`,'AN','','Effekt an/aus')}</h3><div class="knobs">${inner}${K(`fx.${z}.ret`,'Return',0,1,.5,{u:'pct'})}</div></div>`;
 return `<div class="cards">${slot('A','A · Hall',K('fx.A.size','Größe',.4,6,2.4,{u:'s'})+K('fx.A.pre','Pre-Delay',0,.2,.02,{u:'s'})+K('fx.A.tone','Ton',800,16000,7000,{u:'hz',log:1}))}
 ${slot('B','B · Delay',`<div style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Takt</span>${SEG('fx.B.div',[['16','1/16'],['8','1/8'],['8d','3/16'],['4','1/4'],['2','1/2']],'8d')}</div>`+K('fx.B.fb','Feedback',0,.9,.42,{u:'pct'})+K('fx.B.tone','Ton',800,16000,4500,{u:'hz',log:1}))}
 ${slot('C','C · Chorus',K('fx.C.rate','Rate',.05,8,.6,{u:'hzr',log:1})+K('fx.C.dep','Tiefe',0,1,.5,{u:'pct'})+K('fx.C.fb','Flanger',0,.85,.1,{u:'pct'}))}
 ${slot('D','D · Drive',K('fx.D.amt','Drive',0,1,.4,{u:'pct'})+K('fx.D.tone','Ton',500,12000,3500,{u:'hz',log:1}))}</div>
 <p class="hint" style="margin:0">Die Kanäle schicken über ihre Send-Regler A–D in die Effekte. Die Returns kommen nach dem Mixer zurück in die Summe. Delay-Zeit folgt dem Tempo (${S.bpm} BPM).</p>`};
BODY.syntisampler=()=>{const W=[['sawtooth','SAW'],['square','SQR'],['triangle','TRI'],['sine','SIN']];
 const rows=[];for(let r=12;r>=0;r--){rows.push(`<span class="tn ${r%12===0?'root':''}">${NOTES[(S.root+r)%12]}</span>`+S.syn.seq.map((v,s)=>`<button class="stp ${s%4===0?'':'q'} ${v===r?'v2':''}" data-a="syn:${s}:${r}" data-col="${s}" aria-label="Schritt ${s+1}, ${NOTES[(S.root+r)%12]}"></button>`).join(''))}
 return `<div class="row c">${SEL('syn.pre',[['acid','Acid Bass'],['reese','Reese Bass'],['sub','Warmer Sub'],['pluck','Pluck']],'acid','Preset')}<span class="hint">Preset laden überschreibt die Regler.</span></div>
 <div class="cards">
 <div class="card"><h3>OSC 1</h3>${SEG('syn.w1',W)}<div class="knobs">${K('syn.o1','Oktave',-2,2,0,{u:'st',step:1})}${K('syn.dt1','Fein',-50,50,0,{u:'ct'})}</div></div>
 <div class="card"><h3>OSC 2</h3>${SEG('syn.w2',W)}<div class="knobs">${K('syn.o2','Oktave',-2,2,0,{u:'st',step:1})}${K('syn.dt2','Fein',-50,50,7,{u:'ct'})}${K('syn.mix','Mix 1/2',0,1,.3,{u:'pct'})}</div></div>
 <div class="card"><h3>Filter</h3>${SEG('syn.ft',[['lowpass','LP'],['highpass','HP'],['bandpass','BP']])}<div class="knobs">${K('syn.cut','Cutoff',60,16000,380,{u:'hz',log:1})}${K('syn.res','Reso',.1,24,14,{u:'q'})}${K('syn.env','Hüllkurve',0,1,.75,{u:'pct'})}</div></div>
 <div class="card"><h3>Amp</h3><div class="knobs">${K('syn.a','A',.001,1.5,.002,{u:'s',log:1,sz:'s'})}${K('syn.d','D',.01,2,.18,{u:'s',log:1,sz:'s'})}${K('syn.s','S',0,1,.1,{u:'pct',sz:'s'})}${K('syn.r','R',.01,2,.08,{u:'s',log:1,sz:'s'})}</div><canvas class="cv" id="adsr" height="50" style="height:50px"></canvas></div>
 <div class="card"><h3>LFO</h3>${SEG('syn.lt',[['cut','Cutoff'],['pitch','Tonhöhe'],['amp','Pegel']])}<div class="knobs">${K('syn.lr','Rate',.05,20,2,{u:'hzr',log:1})}${K('syn.ld','Tiefe',0,1,0,{u:'pct'})}${K('syn.gl','Glide',0,.3,.04,{u:'s'})}</div></div></div>
 <div class="card"><h3>Sequenzer · 16 Schritte ${T('syn.fol','Folgt Akkord','','Tonart-Grundton folgt dem Akkord des Songs')}</h3>
 <div class="scroll"><div class="grid roll" style="grid-template-columns:34px repeat(16,22px)">${rows.join('')}</div></div>
 <div class="row c"><div class="knobs">${K('syn.oct','Oktave',-1,2,0,{u:'st',step:1,sz:'s'})}${K('syn.gate','Gate',.1,1,.6,{u:'pct',sz:'s'})}</div><button class="btn" data-a="synclr">Leeren</button><button class="btn" data-a="synrnd">Würfeln</button><span class="hint">Ausgang: Kanal 4</span></div></div>`};
BODY.drumsampler=()=>{const pat=S.drm.pat[S.drm.cur];
 return `<div class="row c"><span class="lbl">Pattern</span><div class="seg">${['A','B'].map(z=>`<button data-a="pat:${z}" class="${S.drm.cur===z?'on':''}">${z}</button>`).join('')}</div>
 <button class="tg ${S.drm.chain?'on':''}" data-a="chain" aria-pressed="${S.drm.chain}" title="A und B abwechselnd">A→B Kette</button>
 ${SEL('drm.kit',[['808','808 Classic'],['hard','Hard Techno'],['lofi','Lo-Fi Staub']],'808','Kit')}
 <div class="knobs">${K('drm.swing','Swing',0,.33,.08,{u:'pct',sz:'s'})}${K('drm.acc','Akzent',0,1,.5,{u:'pct',sz:'s'})}</div>
 <button class="btn" data-a="drmclr">Leeren</button><button class="btn" data-a="drmrnd">Würfeln</button></div>
 <div class="scroll"><div class="grid" style="--sw:30px;grid-template-columns:34px 28px repeat(16,30px) 34px 34px 34px">
 <span></span><span></span>${Array.from({length:16},(_,s)=>`<span class="hint mono" style="text-align:center;font-size:9px">${s%4===0?s/4+1:'·'}</span>`).join('')}<span class="lbl" style="font-size:8px">Tune</span><span class="lbl" style="font-size:8px">Decay</span><span class="lbl" style="font-size:8px">Pegel</span>
 ${DTR.map(([id,nm],tr)=>`<span class="tn" title="${nm}">${id}</span>${T(`drm.${tr}.m`,'M','m','Spur stumm')}`+pat[tr].map((v,s)=>`<button class="stp ${s%4===0?'':'q'} ${v?'v'+v:''}" data-a="stp:${tr}:${s}" data-col="${s}" aria-label="${nm} Schritt ${s+1}"></button>`).join('')
  +K(`drm.${tr}.tune`,'',-12,12,0,{u:'st',step:1,sz:'xs',t:nm+' Tune'})+K(`drm.${tr}.dec`,'',.2,2,1,{u:'mul',sz:'xs',t:nm+' Decay'})+K(`drm.${tr}.lvl`,'',0,1,.5,{u:'pct',sz:'xs',t:nm+' Pegel'})).join('')}
 </div></div><p class="hint" style="margin:0">Tippen: an → Akzent → aus. Hi-Hat zu schneidet Hi-Hat offen ab (Choke wie bei der 808). Ausgang: Kanal 3.</p>`};
BODY.instru=()=>{const opts=INS.map(([g,l])=>`<optgroup label="${g}">${l.map(x=>`<option value="${x[0]}">${x[0]}</option>`).join('')}</optgroup>`);
 const keys=[];for(let i=0;i<25;i++){const n=(i)%12,blk=[1,3,6,8,10].includes(n);keys.push({i,blk})}
 const whites=keys.filter(k=>!k.blk);let wi=0;const pos={};keys.forEach(k=>{if(!k.blk)pos[k.i]=wi++;else pos[k.i]=wi});
 return `<div class="row c">${SEL('ins.name',opts,'Konzertflügel','Instrument')}<span class="hint" id="insInfo"></span></div>
 <div class="kbd" id="kbd" aria-label="Tastatur, zwei Oktaven ab C4">${whites.map(k=>`<div class="w" data-key="${k.i}">${k.i%12===0?'C'+(4+k.i/12):''}</div>`).join('')}${keys.filter(k=>k.blk).map(k=>`<div class="b" data-key="${k.i}" style="left:calc(${pos[k.i]/whites.length*100}% - 1.6%)"></div>`).join('')}</div>
 <div class="row"><div class="card"><h3>Spiel</h3><div class="knobs">${K('ins.vel','Anschlag',.1,1,.7,{u:'pct'})}${K('ins.a','Attack',0,1,0,{u:'s'})}${K('ins.r','Release',0,2,.2,{u:'s'})}</div></div>
 <div class="card"><h3>Arpeggiator</h3>${SEG('ins.arp',[['off','Aus'],['up','Hoch'],['down','Runter'],['updown','Hoch-Runter'],['chord','Akkord']],'up')}<div class="row c">${SEG('ins.rate',[['16','1/16'],['8','1/8']],'16')}${K('ins.oct','Oktaven',1,3,2,{u:'int',step:1,sz:'s'})}</div></div></div>
 <p class="hint" style="margin:0">Tastatur am Rechner: A W S E D F T G Z H U J K. Der Arpeggiator folgt den Akkorden von songMONK. Ausgang: Kanal 5.</p>`};
BODY.biblio=()=>{const types=['Alle','Kit','Preset','Loop','Prompt','Take','Song','Sound'],q=S.libQ.toLowerCase();
 const list=S.lib.filter(e=>(S.libF==='Alle'||e.t===S.libF)&&(!q||e.n.toLowerCase().includes(q)));
 return `<div class="row c"><input class="txt" style="max-width:260px" id="libQ" placeholder="Suchen …" value="${esc(S.libQ)}" aria-label="Bibliothek durchsuchen"><div class="chips">${types.map(t=>`<button class="chip ${S.libF===t?'on':''}" data-a="lf:${t}">${t}</button>`).join('')}</div></div>
 <div class="scroll"><table class="tbl"><thead><tr><th>Name</th><th>Typ</th><th>BPM</th><th>Tonart</th><th>Länge</th><th></th></tr></thead><tbody>
 ${list.map(e=>`<tr><td class="n">${esc(e.n)}${e.new?'<span class="new">NEU</span>':''}</td><td>${e.t}</td><td class="mono">${e.bpm||'–'}</td><td>${e.key||'–'}</td><td class="mono">${e.len||'–'}</td><td><button class="btn" data-a="lib:${e.id}">Laden</button></td></tr>`).join('')||'<tr><td colspan="6" class="hint">Nichts gefunden.</td></tr>'}
 </tbody></table></div><p class="hint" style="margin:0">Neue Takes, Songs, Klänge und Importe landen automatisch hier (Markierung NEU).</p>`};
BODY.voice=()=>`<div class="row" style="align-items:stretch"><div class="card" style="flex:2;min-width:240px"><h3>Text</h3><textarea class="txt" id="vocText" rows="2" aria-label="Text für die Stimme">${esc(S.voc.text||'Licht im Kloster, Bass in der Nacht, wir singen bis der Morgen erwacht')}</textarea>
 <div class="syl" id="syl"></div></div>
 <div class="card" style="flex:1;min-width:200px"><h3>Stimme</h3>${SEL('voc.who',Object.entries(VOICES).map(([k,v])=>[k,v[0]]),'mia','Stimme')}${SEG('voc.mode',[['sing','Singen'],['speak','Sprechen'],['whisper','Flüstern']],'sing')}
 <div class="chips">${['Pop','Soul','Oper','Rap','Ambient'].map(s=>`<button class="chip" data-a="vst:${s}">${s}</button>`).join('')}</div></div></div>
 <div class="row c"><div class="knobs">${K('voc.pit','Tonhöhe',-12,12,0,{u:'st',step:1})}${K('voc.form','Formant',-6,6,0,{u:'st'})}${K('voc.vib','Vibrato',0,1,.5,{u:'pct'})}${K('voc.air','Atem',0,1,.15,{u:'pct'})}</div><button class="btn pri" data-a="vocgen">Stimme erzeugen</button><span class="hint">Melodie folgt den Akkorden. Ausgang: Kanal 6.</span></div>`;
BODY.sound=()=>`<div class="row" style="align-items:stretch"><div class="card" style="flex:2;min-width:240px"><h3>Beschreibung</h3><textarea class="txt" id="sndPrompt" rows="2" aria-label="Klangbeschreibung">${esc(S.snd.prompt||'Ein Riser aus Wind und Glocken, der in den Drop führt')}</textarea>
 <div class="row c">${SEG('snd.cat',SNDC,'riser')}<button class="btn pri" data-a="sndgen" style="margin-left:auto">4 Varianten erzeugen</button></div></div>
 <div class="card"><h3>Wiedergabe</h3><div class="knobs">${K('snd.len','Länge',.5,8,3,{u:'s'})}</div><div class="row c"><span class="lbl">Alle</span>${SEG('snd.every',[['1','1'],['2','2'],['4','4'],['8','8']],'4')}<span class="lbl">Takte</span></div></div></div>
 <div class="var" id="vars">${[0,1,2,3].map(k=>`<button data-a="var:${k}" class="${S.snd.var===k?'on':''}"><canvas data-var="${k}"></canvas>Variante ${k+1}</button>`).join('')}</div>
 <div class="row c"><button class="btn" data-a="sndsave">In Bibliothek sichern</button><span class="hint">Ausgang: Kanal 7. Die echte Erzeugung läuft serverseitig; der Entwurf baut die Klänge im Browser nach.</span></div>`;
BODY.stem=()=>`<div class="row c"><label class="btn pri" style="cursor:pointer">Song importieren<input type="file" accept="audio/*" id="stemFile" hidden></label>
 <span><b>${esc(S.stem.name)}</b> <span class="hint">· erkannt ${S.stem.bpm||'–'} BPM · Tonart ${S.stem.key}</span></span>
 ${T('stm.warp','Warp an Projekt','','Tempo an das Projekt anpassen')}<span class="hint mono" id="stemRate"></span></div>
 <div class="stems">${STEMS.map(([id,de,c],i)=>`<div class="stemr" style="--sc:${c};--c:${c}"><span class="tn"><i></i>${de}</span><canvas data-stem="${i}"></canvas>${K(`stm.${i}.lvl`,'',0,1,.8,{u:'pct',sz:'xs',t:de+' Pegel'})}${T(`stm.${i}.m`,'M','m')}${T(`stm.${i}.s`,'S','s')}</div>`).join('')}</div>
 <p class="hint" style="margin:0">Fünf Stems laut Vorgabe: Gesang, Bass, Mitten, Höhen, Melodie. Im Entwurf trennen Frequenzfilter, in der App ein Trennmodell. Ausgang: Kanal 8.</p>`;
BODY.spatial=()=>`<div class="row c">${SEG('sp.lay',[['2.0','Stereo'],['2.1','2.1'],['5.1','5.1'],['7.1','7.1']],'5.1')}<span class="lbl">Quelle</span><div class="chips">${CH.map((id,k)=>`<button class="chip ${S.sp.sel===k?'on':''}" style="--c:${MOD[id].c}" data-a="sps:${k}">${k+1} ${MOD[id].short}</button>`).join('')}</div></div>
 <div class="row" style="align-items:flex-start"><canvas class="cv" id="spc" style="height:260px;flex:1;min-width:240px" aria-label="Raum von oben. Punkte ziehen, um Quellen zu bewegen."></canvas>
 <div class="card" style="min-width:180px"><h3>Bewegung</h3><button class="tg ${S.sp.rec?'on':''}" data-a="sprec">${S.sp.rec?'Aufnahme läuft …':'Pfad aufnehmen'}</button>
 <button class="tg ${S.sp.paths[S.sp.sel]?.play?'on':''}" data-a="spplay" ${S.sp.paths[S.sp.sel]?'':'disabled'}>Pfad abspielen</button><button class="btn" data-a="spclr">Pfad löschen</button>
 <div class="knobs">${K('sp.spd','Tempo',.1,2,.6,{u:'mul'})}${K('sp.w','Breite',0,2,1.2,{u:'pct'})}</div></div></div>
 <p class="hint" style="margin:0">Pfad aufnehmen, dann den Punkt ziehen: die Bewegung wird gespeichert und taktsynchron wiederholt. Im Browser hört man den Stereo-Downmix.</p>`;
BODY.eq=()=>{const i=V['eq.sel'];return `<div class="row c"><span class="lbl">Ziel</span><span>Summe nach dem Mixer</span>${T('eq.an','Analyzer')}</div>
 <canvas class="cv" id="eqc" style="height:200px" aria-label="EQ-Kurve, Punkte ziehen"></canvas>
 <div class="scroll"><div class="row" style="flex-wrap:nowrap">${EQB.map(([n],k)=>`<div class="card" style="min-width:150px;${k===i?'border-color:var(--c)':''}"><h3><button class="tg" data-a="eqsel:${k}" style="border:0;background:none;padding:0">${k+1} · ${n}</button>${T(`eq.${k}.on`,'AN')}</h3><div class="knobs">${K(`eq.${k}.f`,'Freq',20,20000,1000,{u:'hz',log:1,sz:'s'})}${k===0||k===5?'':K(`eq.${k}.g`,'Gain',-18,18,0,{u:'db',sz:'s'})}${K(`eq.${k}.q`,'Q',.3,10,1,{u:'q',log:1,sz:'s'})}</div></div>`).join('')}</div></div>`};
BODY.dsp=()=>`<div class="row" style="align-items:stretch;flex-wrap:wrap">
 <div class="card"><h3>Filter ${T('dsp.f.on','AN')}</h3>${SEG('dsp.f.type',[['lowpass','LP'],['highpass','HP'],['bandpass','BP']])}<div class="knobs">${K('dsp.f.cut','Cutoff',80,20000,14000,{u:'hz',log:1})}${K('dsp.f.res','Resonanz',.1,18,1,{u:'q'})}</div></div><span class="arrow">→</span>
 <div class="card"><h3>Drive ${T('dsp.s.on','AN')}</h3><div class="knobs">${K('dsp.s.drv','Drive',0,1,.2,{u:'pct'})}</div></div><span class="arrow">→</span>
 <div class="card"><h3>Kompressor ${T('dsp.c.on','AN')}</h3><div class="row" style="flex-wrap:nowrap;gap:8px"><div class="knobs" style="max-width:110px">${K('dsp.c.thr','Schwelle',-48,0,-18,{u:'db',sz:'s'})}${K('dsp.c.rat','Ratio',1,20,3,{u:'x',sz:'s'})}${K('dsp.c.att','Attack',.001,.2,.01,{u:'s',log:1,sz:'s'})}${K('dsp.c.rel','Release',.02,1,.2,{u:'s',log:1,sz:'s'})}</div><div class="col" style="display:flex;flex-direction:column;align-items:center;gap:3px"><div class="grm"><i id="dspGr"></i></div><span class="hint mono" id="dspGrT">0 dB</span></div></div></div><span class="arrow">→</span>
 <div class="card"><h3>Gain</h3><div class="knobs">${K('dsp.g.db','Ausgang',-12,12,0,{u:'db'})}</div></div></div>
 <div class="row" style="align-items:stretch"><div class="card"><h3>LFO-Automation ${T('dsp.l.on','AN')}</h3><div class="row c">${SEG('dsp.l.tgt',[['cut','Cutoff'],['res','Resonanz'],['gain','Gain']])}${SEG('dsp.l.wave',[['sine','Sinus'],['triangle','Dreieck'],['square','Rechteck'],['sawtooth','Säge']])}</div><div class="knobs">${K('dsp.l.rate','Rate',.05,12,.5,{u:'hzr',log:1})}${K('dsp.l.dep','Tiefe',0,1,.4,{u:'pct'})}</div></div>
 <div class="card"><h3>Stimmen-Monitor</h3><div class="big" id="vcount">0</div><div class="vox" id="vox">${'<i></i>'.repeat(32)}</div><span class="hint">gleichzeitig klingende Stimmen, Budget 32</span></div></div>`;
BODY.master=()=>`<div class="row c"><span class="lbl">Ziel</span><div class="seg">${Object.entries(TARGETS).map(([k,[n]])=>`<button data-a="tgt:${k}" class="${V['ma.tgt']===k?'on':''}">${n}</button>`).join('')}</div></div>
 <div class="row" style="align-items:stretch">
 <div class="card"><h3>Eingang</h3><div class="knobs">${K('ma.drv','Drive',0,12,2,{u:'db'})}</div></div><span class="arrow">→</span>

   S.song.sections=L;const name=`Take ${S.song.takes.length+1}`;S.song.takes.push(name);S.song.take=S.song.takes.length-1;addLib({n:`Song · ${name} · ${p.slice(0,36)}${p.length>36?'…':''}`,t:'Song',bpm:S.bpm,key:keyName(),len:fmtDur(songLen()*4*60/S.bpm),act:'song:'+name});renderStrip('song');toast(`${name} erzeugt (${S.song.tags.join(', ')||'ohne Stil'}) und in der Bibliothek gesichert.`);break}
  case 'take':S.song.take=+x;S.prog=hash(S.song.takes[+x])%3;renderStrip('song');break;
  case 'sec':{let b2=0;for(let k=0;k<+x;k++)b2+=S.song.sections[k][1];S.song.bar=b2-1;break}
  case 'vst':{const st={Pop:[.4,.1,'sing'],Soul:[.7,.2,'sing'],Oper:[1,.05,'sing'],Rap:[0,.15,'speak'],Ambient:[.3,.6,'whisper']}[x];set('voc.vib',st[0]);set('voc.air',st[1]);set('voc.mode',st[2]);toast(`Stil ${x} gesetzt.`);break}
  case 'vocgen':{const t=($('#vocText')||{}).value||'';S.voc.syl=syllables(t);S.voc.n=-1;drawSyl();addLib({n:`Stimme · ${VOICES[V['voc.who']][0]} · ${t.slice(0,30)}…`,t:'Sound',key:keyName(),act:'voc:'+V['voc.who']});toast('Stimme erzeugt und in der Bibliothek gesichert.');break}
  case 'sndgen':S.snd.seed=Math.floor(Math.random()*1e6);drawVariants();toast('Vier neue Varianten erzeugt.');break;
  case 'var':S.snd.var=+x;$$('#vars button').forEach((el,k)=>el.classList.toggle('on',k===+x));if(A&&A.ctx.state==='running'&&S.play[6])sndPlay(A.ctx,A.ch[6].in,A.ctx.currentTime+.01,V['snd.cat'],S.snd.seed*31+S.snd.var,Math.min(V['snd.len'],3));break;
  case 'sndsave':addLib({n:`Sound · ${SNDC.find(c=>c[0]===V['snd.cat'])[1]} · Variante ${S.snd.var+1}`,t:'Sound',len:fmtDur(V['snd.len']),act:'snd:'+S.snd.var});toast('In der Bibliothek gesichert.');break;
  case 'lf':S.libF=x;renderStrip('biblio');break;
  case 'lib':{const e2=S.lib.find(z=>String(z.id)===b.dataset.a.slice(4));if(e2)libAction(e2);break}
  case 'sps':S.sp.sel=+x;renderStrip('spatial');break;
  case 'sprec':S.sp.rec=!S.sp.rec;if(S.sp.rec)toast(`Jetzt Punkt ${S.sp.sel+1} im Raum ziehen. Loslassen speichert den Pfad.`);renderStrip('spatial');break;
  case 'spplay':{const p=S.sp.paths[S.sp.sel];if(p){p.play=!p.play;p.t0=performance.now()}renderStrip('spatial');break}
  case 'spclr':delete S.sp.paths[S.sp.sel];renderStrip('spatial');break;
  case 'eqsel':V['eq.sel']=+x;renderStrip('eq');break;
  case 'tgt':{V['ma.tgt']=x;const t=TARGETS[x];set('ma.drv',t[1]);set('ma.ceil',t[2]);renderStrip('master');break}
  case 'rec':recToggle();break;
  case 'tk2stem':{const tk=S.takes.find(t=>t.id==x);if(tk){stemStop();STEM.buf=tk.buf;S.stem={name:'Take '+tk.id,bpm:S.bpm,key:keyName(),demo:false};renderStrip('stem');toast(`Take ${tk.id} liegt auf Kanal 8. Im Mixer ▶ auf Kanal 8 drücken.`)}break}
  case 'tkwav':{const tk=S.takes.find(t=>t.id==x);if(!tk)break;const url=URL.createObjectURL(wav(tk.buf)),a2=document.createElement('a');a2.href=url;a2.download=`audioMONASTRY-take-${tk.id}.wav`;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('WAV wird gesichert. In einer eingebetteten Vorschau kann der Browser das Speichern blockieren.');break}
  case 'settings':{const p=$('#panel');p.hidden=!p.hidden;if(!p.hidden)p.innerHTML=`<h3>Einstellungen</h3><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="calm" ${document.body.classList.contains('calm')?'checked':''}> Leuchten und Pulsieren ausschalten</label>
   <h3>Regeln dieser Oberfläche</h3><ul><li>Kopf, Masterplayer, perfMONK und aiMONK sind für alle fest.</li><li>Den Mixer hält genau eine Person. Er ist nicht schließbar und wird nur übergeben.</li><li>Die 15 Plugins: OFF = frei, STBY = gehalten, nicht aktiv, ON = aktiv.</li><li>Fremde Plugins sind gesperrt, ohne Anfragen.</li><li>Ton auf Main startet nur mit ▶ im Mixer-Kanal.</li><li>Verlässt der Halter die Sitzung, bekommt den Mixer, wer am längsten dabei ist.</li></ul><button class="btn" data-a="settings">Schließen</button>`;
   const cb=$('#calm');cb&&cb.addEventListener('change',()=>document.body.classList.toggle('calm',cb.checked));break}
  case 'ai':ai(b.dataset.a.slice(3));break;
 }});
function onToggle(p){if(/^ch\d\.(mute|solo)$/.test(p))return;if(p==='syn.fol')return}
function onSeg(p){if(p==='syn.w1'||p==='syn.w2')return;if(p.startsWith('syn.'))drawAdsr();if(p==='sp.lay')drawSpatial();if(p==='snd.cat')drawVariants()}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='keySel'){const [r,s]=el.value.split(':');S.root=+r;S.scale=s;$('#mpKey').textContent=keyName();renderAll();return}
 if(el.dataset.sel){const p=el.dataset.sel;V[p]=el.value;if(p==='syn.pre')loadSyn(el.value);else if(p==='drm.kit')loadKit(el.value);else apply(p)}});
document.addEventListener('submit',e=>{if(e.target.id==='aiForm'){e.preventDefault();const i=$('#aiIn');ai(i.value);i.value=''}});
document.addEventListener('input',e=>{if(e.target.closest?.('[data-p^="syn."]'))drawAdsr()});
document.addEventListener('pointermove',()=>{if(drag&&drag.p.startsWith('syn.'))drawAdsr()});

/* ---------- Animation: Pegel, Lauflichter, Messung ---------- */
const MP={hist:new Float32Array(600),hi:0,lufsS:[],lufsI:[0,0],peak:-99,lastT:performance.now(),frames:[],lHold:0,rHold:0,lufsHist:[]};
const tbuf=new Float32Array(2048),sbuf=new Float32Array(512);
function peakOf(an,buf){an.getFloatTimeDomainData(buf);let p=0,s=0;for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]);if(v>p)p=v;s+=buf[i]*buf[i]}return [p,Math.sqrt(s/buf.length)]}
const toPct=p=>clamp((20*Math.log10(Math.max(p,1e-5))+60)/60,0,1)*100;
function frame(now){
 const dt=now-MP.lastT;MP.lastT=now;MP.frames.push(dt);if(MP.frames.length>90)MP.frames.shift();
 const playing=S.play.some(Boolean),running=A&&A.ctx.state==='running';
 if(playing&&running)S.playTime+=dt/1000;
 let L=0,R=0,rmsAll=0;
 if(running){[L]=peakOf(A.anL,sbuf);[R]=peakOf(A.anR,sbuf);const [p,r]=peakOf(A.an,tbuf);rmsAll=r;MP.peak=Math.max(MP.peak*.995,p);
  A.ch.forEach((ch,k)=>{const [pk]=peakOf(ch.an,sbuf.subarray(0,256));$$(`[data-m="${k}"]`).forEach(el=>el.style.height=toPct(pk)+'%')});A.retAn.forEach((an,i)=>{const el=document.querySelector(`[data-rm="${i}"]`);if(el){const [pk]=peakOf(an,sbuf.subarray(0,256));el.style.height=toPct(pk)+'%'}})}
 else $$('[data-m]').forEach(el=>el.style.height='0%');
 MP.lHold=Math.max(MP.lHold-.6,toPct(L));MP.rHold=Math.max(MP.rHold-.6,toPct(R));
 for(const [id,v,hold] of [['mpL',L,MP.lHold],['mpR',R,MP.rHold],['mxL',L,MP.lHold],['mxR',R,MP.rHold]]){const el=document.getElementById(id);if(el){el.style.height=toPct(v)+'%';const hp=document.getElementById(id+'p');if(hp)hp.style.bottom=hold+'%'}}
 // Masterplayer-Welle
 MP.hist[MP.hi=(MP.hi+1)%MP.hist.length]=running?Math.max(L,R):0;
 const cv=$('#mpc');if(cv){const [w,h,d]=fitCanvas(cv),g=cv.getContext('2d');g.clearRect(0,0,w,h);const n=MP.hist.length,bw=w/n;
  for(let i=0;i<n;i++){const v=MP.hist[(MP.hi+1+i)%n],hh=Math.max(1*d,Math.min(1,v*1.4)*h*.9);g.fillStyle=i>n*.97?'#ffffff':`rgba(76,201,240,${.25+.75*i/n})`;g.fillRect(i*bw,(h-hh)/2,Math.max(1,bw-.5),hh)}
  const beatPx=w/(MP.hist.length/(60/S.bpm*60));g.fillStyle='rgba(255,255,255,.08)';if(beatPx>4)for(let x=w-((S.playTime*60)%(60/S.bpm*60))*bw;x>0;x-=beatPx)g.fillRect(x,0,1,h)}
 // Zeit, Takt
 const sx=S.playTime;$('#mpTime').textContent=`${Math.floor(sx/60)}:${(sx%60).toFixed(1).padStart(4,'0')}`;
 if(running&&A.q.length){let cur=null;for(const e of A.q)if(e.t<=A.ctx.currentTime&&e.st!=null)cur=e;if(cur){const st=cur.st;$('#mpBar').textContent=`${Math.floor(st/16)+1}.${Math.floor(st%16/4)+1}.${st%4+1}`;highlightStep(st%16)}
  for(const e of A.q)if(e.voc!=null&&e.t<=A.ctx.currentTime&&e.t>A.ctx.currentTime-.05){$$('#syl span').forEach(s=>s.classList.toggle('on',+s.dataset.syl===e.voc))}}
 // LUFS-Näherung
 const lufs=rmsAll>1e-5?20*Math.log10(rmsAll)-0.691:-99;
 if(playing&&running){MP.lufsS.push(lufs);if(MP.lufsS.length>180)MP.lufsS.shift();if(lufs>-70){MP.lufsI[0]+=Math.pow(10,lufs/10);MP.lufsI[1]++}}
 const st=MP.lufsS.length?10*Math.log10(MP.lufsS.reduce((a,b)=>a+Math.pow(10,b/10),0)/MP.lufsS.length):-99,it=MP.lufsI[1]?10*Math.log10(MP.lufsI[0]/MP.lufsI[1]):-99;
 if(now-(frame.l||0)>250){frame.l=now;const f=v=>v>-70?v.toFixed(1):'–';$('#mpLufs').textContent=playing?f(st):'–';
  const gr=running?(A.lim.reduction?.value??A.lim.reduction??0)+(A.glue.reduction?.value??A.glue.reduction??0):0;
  const set2=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};set2('maS',f(st));set2('maI',f(it));set2('maP',MP.peak>0?(20*Math.log10(MP.peak)).toFixed(1):'–');set2('maG',(-gr).toFixed(1));set2('mxGr',(+gr).toFixed(1)+' dB');
  if(playing){MP.lufsHist.push(st);if(MP.lufsHist.length>240)MP.lufsHist.shift()}
  // perf
  const fr=MP.frames,avg=fr.reduce((a,b)=>a+b,0)/fr.length,fps=1000/avg,jit=Math.sqrt(fr.reduce((a,b)=>a+(b-avg)**2,0)/fr.length),lat=A?((A.ctx.baseLatency||0)+(A.ctx.outputLatency||0))*1000:0;
  set2('pfFps',fps.toFixed(0));set2('pfJit',jit.toFixed(1)+' ms');set2('pfLat',A?lat.toFixed(1)+' ms':'–');set2('pfVc',S.voices);set2('pfLate',A?A.late.toFixed(1)+' ms':'–');set2('pfSr',A?(A.ctx.sampleRate/1000)+' kHz':'–');set2('vcount',S.voices);
  const bud=(id,v,col)=>{const el=document.getElementById(id);if(el){el.style.width=clamp(v,0,1)*100+'%';el.style.background=col}};
  bud('pfFpsB',fps/60,fps>50?'var(--ok)':fps>30?'var(--warn)':'var(--hot)');bud('pfJitB',jit/16,jit<4?'var(--ok)':'var(--warn)');bud('pfLatB',lat/40,lat<20?'var(--ok)':'var(--warn)');bud('pfVcB',S.voices/32,S.voices<24?'var(--ok)':'var(--hot)');bud('pfLateB',(A?A.late:0)/50,(A?A.late:0)<20?'var(--ok)':'var(--hot)');
  $$('#vox i').forEach((el,i)=>el.classList.toggle('on',i<S.voices));
  const pf=$('#pfc');if(pf){MP.fpsH=(MP.fpsH||[]);MP.fpsH.push(fps);if(MP.fpsH.length>120)MP.fpsH.shift();const [w,h,d]=fitCanvas(pf),g=pf.getContext('2d');g.clearRect(0,0,w,h);g.strokeStyle='#1b263a';g.beginPath();g.moveTo(0,h*(1-60/70));g.lineTo(w,h*(1-60/70));g.stroke();g.strokeStyle=MOD.mixer.c;g.lineWidth=1.5*d;g.beginPath();MP.fpsH.forEach((v,i)=>{const x=i/119*w,y=h*(1-Math.min(v,70)/70);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
  const mc=$('#mac');if(mc){const [w,h,d]=fitCanvas(mc),g=mc.getContext('2d'),Y=v=>h*(1-(clamp(v,-36,0)+36)/36);g.clearRect(0,0,w,h);const tg=+V['ma.tgt'];g.strokeStyle='#ffb703';g.setLineDash([5*d,4*d]);g.beginPath();g.moveTo(0,Y(tg));g.lineTo(w,Y(tg));g.stroke();g.setLineDash([]);g.fillStyle='#6f7f9d';g.font=`${10*d}px JetBrains Mono,monospace`;g.fillText(`Ziel ${tg} LUFS`,6*d,Y(tg)-4*d);
   g.strokeStyle=MOD.master.c;g.lineWidth=2*d;g.beginPath();MP.lufsHist.forEach((v,i)=>{const x=i/239*w,y=Y(v);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}
  updateChain()}
 // DSP-Reduktion, Recorder
 if(running){const gr=-(A.dComp.reduction?.value??A.dComp.reduction??0);const el=$('#dspGr');if(el){el.style.height=clamp(gr/24,0,1)*100+'%';$('#dspGrT').textContent=gr.toFixed(1)+' dB'}
  const rm=$('#recM');if(rm){const [p]=peakOf(A.recAn,sbuf);rm.style.width=toPct(p)+'%'}
  if(S.rec){const el2=$('#recT');if(el2){const t=A.ctx.currentTime-REC.t0;el2.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`}}}
 // Song-Abspielkopf
 const tl=$$('[data-sec]');if(tl.length){let b2=S.song.bar,idx=0,frac=0;for(const [k,[,len]] of S.song.sections.entries()){if(b2<len){idx=k;frac=b2/len;break}b2-=len}
  tl.forEach((el,k)=>{el.classList.toggle('on',k===idx&&S.play[1]);const i=el.querySelector('i');i.hidden=!(k===idx&&S.play[1]);i.style.setProperty('--x',frac*100+'%')});
  const sc=$('#songChord');if(sc)sc.textContent='Akkord jetzt: '+chordAt(curBar()).map(n=>NOTES[(S.root+n)%12]).join(' ')}
 // Raumpfade
 let spMoved=false;Object.entries(S.sp.paths).forEach(([k,p])=>{if(!p.play||p.pts.length<2)return;const per=(60/S.bpm*4*2)/V['sp.spd'],t=((now-(p.t0||0))/1000%per)/per,i=Math.floor(t*(p.pts.length-1));V[`sp.${k}.x`]=p.pts[i][0];V[`sp.${k}.y`]=p.pts[i][1];spMoved=true});
 if(spMoved)applySpatial();if($('#spc'))drawSpatial();if($('#eqc')&&running)drawEq();
 const sr=$('#stemRate');if(sr)sr.textContent=`× ${stemRate().toFixed(3)} (${S.stem.bpm||'–'} → ${S.bpm} BPM)`;
 requestAnimationFrame(frame)}
function highlightStep(s){if(highlightStep.l===s)return;highlightStep.l=s;$$('.stp.ph').forEach(e=>e.classList.remove('ph'));if(S.play[2])$$(`#m-drumsampler [data-col="${s}"]`).forEach(e=>e.classList.add('ph'));if(S.play[3])$$(`#m-syntisampler [data-col="${s}"]`).forEach(e=>e.classList.add('ph'))}

/* ---------- Start ---------- */
renderAll();renderFoot();renderDemoLoop();requestAnimationFrame(frame);
$('#mpKey').textContent=keyName();
addEventListener('resize',()=>{drawStems();drawVariants();drawTakes();drawAdsr();drawEq()});
