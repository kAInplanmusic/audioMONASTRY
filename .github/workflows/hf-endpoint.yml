name: hf-endpoint

on:
  push:
    branches: [main]
    paths:
      - 'services/samplemonk-ai-runtime/**'
      - '.github/workflows/hf-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samplemonk-ai-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Runner-Speicher freigeben (no space left on device vermeiden)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: GHCR Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-URL bestimmen
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      - name: Build & Push (Custom Container)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: services/samplemonk-ai-runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: GHCR-Paket öffentlich machen (best effort; sonst Registry-Credentials)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public \
          || echo "INFO: Paket bleibt privat – HF erhält Registry-Credentials (GHCR_USERNAME/GHCR_PASSWORD)."

  create-or-update-endpoint:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency: hf-endpoint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: huggingface_hub installieren
        run: pip install --quiet huggingface_hub

      - name: HF-Endpoint anlegen/aktualisieren (A100, scale-to-zero)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          HF_ENDPOINT_NAME: samplemonk-ai
          HF_NAMESPACE: AnunnakiTools
          HF_REGION: us-east-1
          HF_INSTANCE_TYPE: nvidia-a100
          HF_REGISTRY_USERNAME: ${{ secrets.GHCR_USERNAME }}
          HF_REGISTRY_PASSWORD: ${{ secrets.GHCR_PAT_ALL_ACCESS || secrets.GHCR_PASSWORD }}
          HF_INSTANCE_SIZE: x1
          HF_SCALE_TO_ZERO_TIMEOUT: '20'
          AI_MAX_GPU_ENDPOINTS: '1'
        run: python services/samplemonk-ai-runtime/hf_manage_endpoint.py update

      - name: Endpoint-Status ausgeben
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python services/samplemonk-ai-runtime/hf_manage_endpoint.py status
