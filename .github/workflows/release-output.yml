name: Release output PCM

on:
  pull_request:
    paths:
      - 'src/audio/**'
      - 'src/core/audio/**'
      - 'src/core/spatial/**'
      - 'tests/e2e/release-output.spec.ts'
      - 'tests/e2e/fixtures/release-output.*'
      - 'playwright.release-output.config.ts'
      - '.github/workflows/release-output.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.release-output.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-output-chromium
          path: test-results/
