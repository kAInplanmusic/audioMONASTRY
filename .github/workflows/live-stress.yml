name: Live Stress (on-demand)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Basis-URL der Live-Instanz (z. B. https://anunnakitools.de)'
        required: true
        default: 'https://anunnakitools.de'

jobs:
  live-stress:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # SECURITY: inputs.base_url wird NUR als Env-Variable übergeben – keine
      # Inline-Interpolation in run:-Schritten (Shell-Injection-Schutz).
      - name: HTTP/Socket.io-Stresstest
        run: node scripts/hetzner/stress-test.mjs

      - name: Browser-Engine-Stresstest
        run: npm run test:stress

      - name: Upload Stress-Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stress-results
          path: test-results/
          retention-days: 7

      - name: Auto-Issue bei Fehler (Erkennung -> Reparatur-Route)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          STRESS_BASE_URL: ${{ inputs.base_url }}
        with:
          script: |
            const baseUrl = process.env.STRESS_BASE_URL;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Live-Stresstest fehlgeschlagen – ' + new Date().toISOString().slice(0, 10),
              body: 'Der Live-Stresstest gegen ' + baseUrl + ' ist fehlgeschlagen.\nRun: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['auto-detected', 'bug'],
            });
