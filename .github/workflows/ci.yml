name: CI – Verify + Build (Pflicht-Gate)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint, 0 Errors/Warnings)
        run: npm run lint

      - name: Unit-/Integration-Tests (vitest, ohne stille Skips)
        # CI-P1-001: `test:ci` schreibt den JSON-Report und lässt den Lauf
        # fehlschlagen, wenn ein Test übersprungen oder als todo markiert ist.
        run: npm run test:ci

      - name: Security (npm audit + Interface-Boundary-Scan)
        run: npm run security

      - name: Production-Build
        run: npm run build
