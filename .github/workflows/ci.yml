name: CI – Verify + Build (Pflicht-Gate)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint, 0 Errors/Warnings)
        run: npm run lint

      - name: ffmpeg installieren (Audio-Gate PROD-P1-002)
        # Die GitHub-Runner bringen ffmpeg NICHT mit; ohne diese Zeile faellt
        # tests/audioGate.test.ts mit 'spawnSync ffmpeg ENOENT' um.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Unit-/Integration-Tests (vitest, ohne stille Skips)
        # CI-P1-001: `test:ci` schreibt den JSON-Report und lässt den Lauf
        # fehlschlagen, wenn ein Test übersprungen oder als todo markiert ist.
        run: npm run test:ci

      - name: Python-Smoke (Plugin-Contract + AI-Runtime repository/revision)
        # QUAL-P2-005 (FA-P2-2): reine stdlib-Tests, kein pip-Install nötig.
        run: |
          python3 -m unittest tests.plugin_interface_test
          python3 tests/test_runpod_comfyui_probe.py
          python3 tests/test_comfyui_ui_to_api.py
          python3 tests/test_runpod_deploy_defaults.py
          python3 services/audiomonastry-ai-runtime/tests/test_tts_language.py
          python3 services/audiomonastry-ai-runtime/tests/test_model_definition.py
          python3 services/audiomonastry-ai-runtime/tests/test_llm_trust_remote_code.py
          python3 services/audiomonastry-ai-runtime/tests/test_moa_orchestrator.py
          # VOICE-P1-001: Qwen3-TTS-Handler mit gestubbten Abhaengigkeiten (stdlib only).
          python3 services/audiomonastry-ai-runtime/tests/test_qwen3_tts_handler.py
          python3 services/audiomonastry-ai-runtime/tests/test_comfyui_adapter.py

      - name: Security (npm audit + Interface-Boundary-Scan)
        run: npm run security

      - name: Production-Build
        run: npm run build
