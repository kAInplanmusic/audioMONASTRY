name: vast-http-qa-compatibility-entry
on:
  workflow_dispatch:
    inputs:
      image_run_id:
        required: true
        type: string
      cold_start_max_eur:
        required: true
        type: number
        default: -1
permissions:
  contents: read
  actions: read
jobs:
  vast-qa:
    uses: ./.github/workflows/vast-http-fleet-qa.yml
    with:
      image_run_id: ${{ inputs.image_run_id }}
      cold_start_max_eur: ${{ inputs.cold_start_max_eur }}
    secrets: inherit
