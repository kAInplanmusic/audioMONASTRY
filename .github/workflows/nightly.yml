name: Nightly Verify

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 06:00 DE (Sommerzeit) – nach DJ-Betrieb
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + Tests + Boundary-Scan
        # AM-E6-6: enthält tests/goldenAudio.test.ts als A/B-Regressions-Gate
        # (bit-genauer Fixture-Vergleich + P0-4-Stille-Test). DSP-Regress = FAIL.
        run: npm run verify

      - name: Production Build
        run: npm run build

      # AM-E5-2: Heap-Wachstums-Gate (< 512 MB Delta) gegen schleichende Leaks.
      - name: Memory-Pressure-Gate (< 512 MB Heap-Delta)
        run: npm run check:memory

      - name: Bundle-Budget-Check
        run: node scripts/check-bundle-size.mjs || true

      # P3-3: Eval-Run je Plugin (21 deterministische Kern-Kommandos),
      # schreibt ai-evaluations.json/ai-eval-runs.json + ai-eval-report.md
      # (Score, Dauer, Fehler je Plugin) und bricht bei Score-Abfall oder
      # Laufzeit-Überschreitung (Gate aus evalMatrix) mit Exit 1 ab.
      - name: AI-Eval-Run (Gate bei Score-Abfall)
        run: npm run eval:ai

      # P3-2: Prompt-Iterations-Loop je Plugin (Konvergenz-Gate).
      - name: Prompt-Iterations-Loop (Gate bei Nicht-Konvergenz)
        run: npm run iterate:prompts

      - name: Eval-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          path: |
            test-results/ai-eval*.json
            test-results/ai-eval-report.md
            test-results/prompt-iterations.json
            test-results/system-prompts.json
          if-no-files-found: error

      - name: Eval-Report in die Job-Summary schreiben
        if: always()
        run: cat test-results/ai-eval-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Auto-Issue bei Fehler (Erkennung -> Reparatur-Route)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Nightly-Check fehlgeschlagen – ' + new Date().toISOString().slice(0, 10),
              body: 'Der nächtliche Qualitäts-Check (verify/build/bundle/eval) ist fehlgeschlagen.\nRun: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['auto-detected', 'bug'],
            });

  # AM-E5-4: Real-Time-Deadline-/Stress-Langtest. Der vollständige
  # 24-h-Dropout-Lauf (0 Xruns bei 4-User-Last) bleibt Live; dieser Job ist
  # das automatisierte Nightly-Gate (Stress-Suite mit Playwright Chromium).
  stress-longtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Stress-Test (21 Plugins, 8000 Pattern-Loads, Play/Stop, FPS/Heap)
        run: npm run test:stress
