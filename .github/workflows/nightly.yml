name: Nightly Verify

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 06:00 DE (Sommerzeit) – nach DJ-Betrieb
  workflow_dispatch: {}

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + Tests + Boundary-Scan
        run: npm run verify

      - name: Production Build
        run: npm run build

      - name: Bundle-Budget-Check
        run: node scripts/check-bundle-size.mjs || true

      - name: Auto-Issue bei Fehler (Erkennung -> Reparatur-Route)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Nightly-Check fehlgeschlagen – ' + new Date().toISOString().slice(0, 10),
              body: 'Der nächtliche Qualitäts-Check (verify/build/bundle) ist fehlgeschlagen.\nRun: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['auto-detected', 'bug'],
            });
