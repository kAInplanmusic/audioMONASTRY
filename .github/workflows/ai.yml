name: ai

on:
  push:
    branches: [main]
    paths:
      - 'src/core/ai/**'
      - 'services/audiomonastry-ai-runtime/**'
      - 'server.ts'
      - 'tests/aiOrchestrator.test.ts'
  pull_request:
    paths:
      - 'src/core/ai/**'
      - 'services/audiomonastry-ai-runtime/**'
      - 'server.ts'
      - 'tests/aiOrchestrator.test.ts'

jobs:
  ai-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ffmpeg installieren (Audio-Gate PROD-P1-002)
        # Die GitHub-Runner bringen ffmpeg NICHT mit; ohne diese Zeile faellt
        # tests/audioGate.test.ts mit 'spawnSync ffmpeg ENOENT' um.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: AI-Unit-Tests
        run: npx vitest run tests/aiOrchestrator.test.ts
      - name: Boundary-Scan
        run: node scripts/validate-interface-boundaries.mjs
      - name: Python-Smoke (Runtime ohne GPU, simulated)
        run: |
          pip install --target /tmp/smoke-ai-deps fastapi uvicorn
          cd services/audiomonastry-ai-runtime
          PYTHONPATH=/tmp/smoke-ai-deps:. AI_RUNTIME_DEVICE=simulated python3 -c "import app; print('app import ok')"
      - name: Security-Check (npm audit)
        run: npm audit --omit=dev --audit-level=high
