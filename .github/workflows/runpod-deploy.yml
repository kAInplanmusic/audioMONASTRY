# RETIRED: This filename is kept so old workflow URLs fail safely.
# Do not restart the historical Serverless imageHq/videoReal/orchestrator fleet.
name: "RETIRED RunPod Serverless deployment (blocked)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete deployment
        run: |
          echo "::error::Historical Serverless deployment is retired."
          echo "::error::Active fleet SSOT: deploy/runpod/pod-fleet.json and docs/RUNPOD_FLEET_SSOT.md"
          echo "::error::Use scripts/runpod-ssot-preflight.py and scripts/runpod-pods.py after live verification."
          exit 1
