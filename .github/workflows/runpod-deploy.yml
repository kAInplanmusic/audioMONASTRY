name: runpod-deploy

on:
  workflow_dispatch:
    inputs:
      role:
        description: 'Nur eine Rolle deployen (leer = alle acht: brain|ears|voiceGen|music|imageHq|videoReal|videoAbstract|orchestrator)'
        required: false
        default: ''
        type: string
      idle_timeout:
        description: 'Idle-Timeout in Minuten (Auto-Shutdown bei Untätigkeit)'
        required: false
        default: '15'
        type: string
      # INFRA-RUNPOD-010: optionaler Bake-Pfad. Leer (Default) = Verhalten wie
      # bisher: EIN schlankes Image (:latest/:<sha>) ohne eingebackene Gewichte,
      # das beim Kaltstart jedes Mal nachlaedt. Gesetzt = ZUSAETZLICHES Image
      # dieses Runnings mit eingebackenen Gewichten der Rolle
      # (Dockerfile.runpod ARG AI_BAKE_ROLE) plus RP_IMAGE_<TOKEN> fuer die Rolle.
      bake_role:
        description: 'Optional: Rollen-Image mit eingebackenen Gewichten bauen (leer = nichts; erlaubt: ears|voiceGen|orchestrator)'
        required: false
        default: ''
        type: string
      bake_groups:
        description: 'Optional: Layer-Gruppen des Bakes (leer = Repo-Variable AI_BAKE_GROUPS, sonst 4)'
        required: false
        default: ''
        type: string
  push:
    # SSOT ist `main`; `runpod-migration` bleibt als historischer Deploy-Branch
    # erlaubt, damit alte Pushes nicht ins Leere laufen.
    branches: [main, runpod-migration]
    paths:
      - 'services/audiomonastry-ai-runtime/**'
      - '.github/workflows/runpod-deploy.yml'
      - 'scripts/runpod-deploy.py'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: audiomonastry-ai-runtime-runpod

jobs:
  # Ein Image für die Rollen unseres eigenen Runtimes (ears, voiceGen, optional
  # music/orchestrator) – die Rolle wird zur Laufzeit über AI_ROLE und das
  # Rollen-Manifest gewählt (siehe docs/runpod-8-instances-complete-plan.md).
  # brain nutzt den vorgefertigten vLLM-Worker, die visuellen Rollen
  # (imageHq/videoReal/videoAbstract) und standardmäßig music vorgefertigte
  # ComfyUI-/Hub-Worker (siehe scripts/runpod-deploy.py → PREBUILT_IMAGES).
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Runner-Speicher freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      # INFRA-RUNPOD-008: Der Push nach GHCR scheiterte bei JEDEM Lauf mit
      # "denied: permission_denied: write_package" (der Build selbst lief durch).
      # Ursache ist die Paketbindung: der GITHUB_TOKEN darf nur schreiben, wenn
      # das Paket an DIESES Repository gebunden ist. Deshalb wird jetzt zuerst
      # der auch im Deploy-Job benutzte PAT probiert (GHCR_PAT_ALL_ACCESS, dann
      # GHCR_PASSWORD) und erst danach der Repo-Token - damit funktioniert der
      # Push ohne Workflow-Aenderung, sobald einer der Secrets existiert.
      # Betreiber-Seite (empfohlen, dauerhaft sauber): Paket
      # `audiomonastry-ai-runtime-runpod` -> Settings -> "Manage Actions access"
      # -> Repo kAInplanmusic/audioMONASTRY mit Rolle Write aufnehmen.
      - name: GHCR Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_PAT_ALL_ACCESS != '' && github.repository_owner || github.actor }}
          password: ${{ secrets.GHCR_PAT_ALL_ACCESS || secrets.GHCR_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Image-URL bestimmen
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      # INFRA-RUNPOD-010: Ziel-Tag des optionalen Rollen-Images. Der Input kommt
      # ueber `env` (nicht direkt in den Befehl interpoliert) und wird gegen eine
      # Allow-Liste geprueft: gebacken wird nur das EIGENE Runtime-Image
      # (Dockerfile.runpod) - music/imageHq/videoReal/videoAbstract laufen auf
      # vorgefertigten Hub-Workern mit eigenen Gewichten, ein Override wuerde sie
      # kaputt machen. Ohne bake_role laeuft dieser Schritt nicht (Push auf main
      # bleibt damit unveraendert schlank).
      - name: Bake-Ziel bestimmen (optional, nur workflow_dispatch)
        id: bake
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bake_role != ''
        env:
          BAKE_ROLE: ${{ github.event.inputs.bake_role }}
          BAKE_GROUPS_INPUT: ${{ github.event.inputs.bake_groups }}
          BAKE_GROUPS_VAR: ${{ vars.AI_BAKE_GROUPS }}
        run: |
          set -euo pipefail
          case "$BAKE_ROLE" in
            ears|voiceGen|orchestrator) ;;
            *)
              echo "::error::bake_role='${BAKE_ROLE}' ist nicht erlaubt. Gebacken wird nur das eigene Runtime-Image; erlaubt sind: ears, voiceGen, orchestrator (brain laeuft auf dem vorgefertigten vLLM-Worker, music/imageHq/videoReal/videoAbstract auf Hub-Workern mit eigenen Gewichten)."
              exit 1
              ;;
          esac
          ROLE_LOWER=$(echo "$BAKE_ROLE" | tr '[:upper:]' '[:lower:]')
          GROUPS="${BAKE_GROUPS_INPUT}"
          if [ -z "$GROUPS" ]; then GROUPS="${BAKE_GROUPS_VAR}"; fi
          if [ -z "$GROUPS" ]; then GROUPS="4"; fi
          echo "role=${BAKE_ROLE}" >> "$GITHUB_OUTPUT"
          echo "role_lower=${ROLE_LOWER}" >> "$GITHUB_OUTPUT"
          echo "groups=${GROUPS}" >> "$GITHUB_OUTPUT"
          echo "Bake-Ziel: Rolle ${BAKE_ROLE} | Tag ${ROLE_LOWER} | Groups ${GROUPS}"

      # Betreiberentscheidung 2026-09-10: Das Einbacken der 29,5 GB Qwen3-14B-
      # Gewichte ist ZURUECKGEZOGEN. Es loeste ein Problem, das mit der Vorgabe
      # "Kaltstart < 15 min genuegt" nicht mehr existiert: GEMESSEN war der erste
      # echte llm-Aufruf am Brain inklusive Download, Modell-Load und 64 Tokens
      # nach 201 s fertig (delay 71 s + exec 58 s). Der Rest ist Worker-
      # Provisionierung, nicht der Download. Damit entfaellt der 30-GB-CI-Build,
      # der dreimal fehlschlug, und alle drei Rollen nutzen EIN Image.
      - name: Build & Push (shared – ears + voiceGen)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: services/audiomonastry-ai-runtime
          file: services/audiomonastry-ai-runtime/Dockerfile.runpod
          push: true
          build-args: |
            AI_INSTALL_AUDIO_AI=1
            AI_INSTALL_VOICE_AI=1
            AI_INSTALL_VLLM=0
            AI_BAKE_ROLE=
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: GHCR-Paket öffentlich machen (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public \
          || echo "INFO: Paket bleibt privat – GHCR_USERNAME/GHCR_PASSWORD werden benötigt."

      # ---------------------------------------------------------------------
      # Abhängigkeits-Proben
      # ---------------------------------------------------------------------
      # Jede Probe ist ein eigener Step mit `continue-on-error`, damit der
      # Step-Status (auch ohne Log-Zugriff auswertbar) zeigt, WELCHER Import
      # kaputt ist. Genau daran ist der Brain-LLM-Task gescheitert
      # (`MODEL_UNAVAILABLE`, weil `_require_lib` einen ImportError fängt).
      - name: Probe 1 – torch importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import torch; print(torch.__version__)"

      - name: Probe 2 – transformers über den Worker-Pfad (_require_lib)
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "from handlers_runpod import _require_lib; print('require_lib ok', _require_lib('transformers','transformers').__version__)"

      - name: Probe 3 – transformers kennt Qwen3-14B
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "from transformers import AutoConfig; print(AutoConfig.from_pretrained('Qwen/Qwen3-14B').model_type)"

      - name: Probe 3b – huggingface-hub Version
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import huggingface_hub; print(huggingface_hub.__version__)"

      - name: Probe 4 – soundfile + scipy importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import soundfile, scipy; print(soundfile.__version__, scipy.__version__)"

      - name: Probe 5 – diffusers importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import diffusers; print(diffusers.__version__)"

      - name: Probe 6 – pyannote.audio importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import pyannote.audio; print('ok')"

      - name: GATE – qwen_tts importierbar (voiceMONK TTS)
        # Bewusst OHNE continue-on-error: ein kaputter qwen_tts-Import blieb
        # bisher grün und meldete sich erst zur Laufzeit als MODEL_UNAVAILABLE
        # (live belegt am 2026-09-11). Der Fix ist NUMBA_CACHE_DIR im
        # Dockerfile.runpod – dieses Gate beweist ihn bei jedem Build.
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import qwen_tts; print('qwen_tts import ok')"

      - name: Probe 8 – Worker-Handler-Tabelle läd
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import handlers; print('llm' in handlers.HANDLERS, sorted(handlers.HANDLERS))"

      - name: Probe 8b – demucs importierbar (Stem-Separation)
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "import demucs; print('demucs ok')"

      # Orchestrator (Instanz 8): der Handler muss im Image liegen UND in der
      # Worker-Tabelle haengen – ein fehlender Import faellt sonst erst zur
      # Laufzeit als MODEL_UNAVAILABLE auf (gleiche Fehlerklasse wie qwen_tts).
      - name: GATE – MoA-Orchestrator importierbar + registriert
        run: |
          docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "
          import moa_orchestrator, comfyui_adapter, handlers
          assert 'agent.orchestrate' in handlers.HANDLERS, sorted(handlers.HANDLERS)
          assert moa_orchestrator.TOOL_CATALOG, 'Tool-Katalog leer'
          assert comfyui_adapter.COMFY_ROLES, 'ComfyUI-Rollen leer'
          print('MoA ok:', len(moa_orchestrator.TOOL_CATALOG), 'Tools |', len(comfyui_adapter.COMFY_ROLES), 'ComfyUI-Rollen')
          "

      # ---------------------------------------------------------------------
      # GATE (bewusst OHNE continue-on-error): torch >= 2.6 ist Pflicht.
      # `torch.load` verweigert darunter das Laden von Pickle-Checkpoints, und
      # `laion/larger_clap_music` (CLAP-Audio-Embeddings, Rolle ears) liefert
      # nur pytorch_model.bin – der safetensors-Ausweg greift dort nicht. Mit
      # torch 2.5.1 scheiterte jedes `task=embed` an einem ValueError, ohne dass
      # ein Gate angeschlagen hat (live belegt 2026-09-12). Ohne diesen Block
      # fällt die Grenze beim nächsten Basis-Image-Wechsel still zurück.
      - name: GATE – torch >= 2.6 (CLAP-Pickle-Checkpoints)
        run: |
          docker run --rm --entrypoint python "${{ steps.meta.outputs.image }}:${{ github.sha }}" -c "
          import sys, torch
          print('torch', torch.__version__)
          major, minor = (int(x) for x in torch.__version__.split('+')[0].split('.')[:2])
          sys.exit(0 if (major, minor) >= (2, 6) else 1)
          "

      # ------------------------------------------------------------------
      # INFRA-RUNPOD-010: OPTIONALES Rollen-Image mit eingebackenen Gewichten.
      # Laeuft NUR mit workflow_dispatch-Input bake_role (Default leer) - ein
      # normaler Push auf main baut weiter das EINE schlanke Image ohne Bake
      # (AI_BAKE_ROLE= leer, siehe Step "Build & Push (shared)"), damit der
      # Normalfall klein und schnell bleibt.
      # Warum Bake statt Network Volume: Volumes gibt es nur in einem Teil der
      # Rechenzentren, und dort gibt es keinen A40/A6000-Pool (Dockerfile.runpod,
      # "Rollen-Gewichte einbacken"). Warum ueberhaupt: der Kaltstart ohne Bake
      # laedt die Gewichte bei JEDEM neuen Worker (live 2026-09-20: 19,6 min
      # Wartezeit auf 7,6 s Arbeit, siehe docs/RUNPOD_COLDSTART.md).
      # Dieses Image ersetzt das schlanke NICHT: es bekommt einen eigenen Tag.
      - name: Build & Push Rollen-Image mit eingebackenen Gewichten (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bake_role != ''
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: services/audiomonastry-ai-runtime
          file: services/audiomonastry-ai-runtime/Dockerfile.runpod
          push: true
          build-args: |
            AI_INSTALL_AUDIO_AI=1
            AI_INSTALL_VOICE_AI=1
            AI_INSTALL_VLLM=0
            AI_BAKE_ROLE=${{ steps.bake.outputs.role }}
            AI_BAKE_GROUPS=${{ steps.bake.outputs.groups }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}-baked-${{ steps.bake.outputs.role_lower }}
            ${{ steps.meta.outputs.image }}:baked-${{ steps.bake.outputs.role_lower }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Bake-Rolle ${{ steps.bake.outputs.role }}

      # Beleg statt Annahme: der Tag liegt wirklich in GHCR (dieser Job ist dort
      # eingeloggt). Best effort – ein Manifest-Fehler ist nicht der Deploy-Fehler.
      - name: Bake-Tag in GHCR pruefen (best effort)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bake_role != ''
        continue-on-error: true
        run: |
          docker manifest inspect "${{ steps.meta.outputs.image }}:baked-${{ steps.bake.outputs.role_lower }}-latest" > /dev/null \
            && echo "Bake-Tag vorhanden: ${{ steps.meta.outputs.image }}:baked-${{ steps.bake.outputs.role_lower }}-latest" \
            || echo "INFO: Bake-Tag (noch) nicht per manifest inspect lesbar."

  # Alle drei Rollen-Endpoints. workers_min bleibt 0 (Scale-to-Zero); der
  # Session-Wake hebt es beim Studio-Eintritt temporär auf 1.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: RunPod SDK installieren
        run: python3 -m pip install --quiet runpod==1.12.0

      # INFRA-RUNPOD-010: Bei gesetztem bake_role bekommt GENAU DIESE Rolle das
      # gebackene Image - ueber RP_IMAGE_<TOKEN>, das den Rollen-Image-Override in
      # scripts/runpod-deploy.py ausloest (Vorrang vor dem globalen IMAGE). Alle
      # anderen Rollen bleiben auf dem schlanken :<sha>-Image.
      # Der Rollenname kommt ueber `env` (nicht interpoliert) und wird gegen
      # dieselbe Allow-Liste geprueft wie der Bake; ein unbekannter Name bricht
      # hier ab, statt den Deploy mit einem wirkungslosen Override laufen zu lassen.
      # WICHTIG: Es wird KEINE Variable fuer Rollen ohne Bake gesetzt - ein LEERES
      # RP_IMAGE_<TOKEN> ist im Deploy ein harter Fehler (Exit 2), kein stiller Fallback.
      - name: Rollen-Image-Override setzen (nur mit bake_role)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bake_role != ''
        env:
          BAKE_ROLE: ${{ github.event.inputs.bake_role }}
          IMAGE_BASE: ${{ needs.build.outputs.image }}
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          case "$BAKE_ROLE" in
            ears)         TOKEN=EARS ;;
            voiceGen)     TOKEN=VOICE ;;
            orchestrator) TOKEN=ORCHESTRATOR ;;
            *)
              echo "::error::bake_role='${BAKE_ROLE}' hat keine Rollen-Token-Zuordnung – erwartet: ears|voiceGen|orchestrator."
              exit 1
              ;;
          esac
          ROLE_LOWER=$(echo "$BAKE_ROLE" | tr '[:upper:]' '[:lower:]')
          BAKED="${IMAGE_BASE}:${GITHUB_SHA}-baked-${ROLE_LOWER}"
          echo "RP_IMAGE_${TOKEN}=${BAKED}" >> "$GITHUB_ENV"
          echo "Rolle ${BAKE_ROLE} faehrt das Rollen-Image ${BAKED} (RP_IMAGE_${TOKEN}); alle anderen Rollen bleiben auf ${IMAGE_REF}"

      - name: Preflight – Pflicht-Secrets prüfen
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
        run: |
          if [ -z "${RP_API_KEY:-}" ]; then
            echo "::error::Repo-Secret RP_API_KEY fehlt oder ist leer – RunPod-Deploy nicht möglich (siehe logs/run-2026-09-10/RUN_PROTOKOLL.md)."
            echo "Lokal funktioniert das Deploy stattdessen mit:"
            echo "  IMAGE=<ghcr-image> RUNPOD_GPU_ID=AMPERE_48 RUNPOD_IDLE_TIMEOUT=15 python3 scripts/runpod-deploy.py"
            exit 1
          fi
          echo "RP_API_KEY ist gesetzt."

      - name: RunPod Serverless Endpoints deployen
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          RUNPOD_ROLE: ${{ github.event.inputs.role }}
          # Kein globales RUNPOD_GPU_ID / RUNPOD_IDLE_TIMEOUT mehr: sie
          # überschrieben ALLE Rollen-Defaults (Video-Rollen brauchen ADA_24,
          # ihre Worker-Images sind auf Ada/CUDA 12.8 ausgelegt) und kippten die
          # Manifest-Wahrheit. Autoritativ ist ROLE_DEFAULTS in
          # scripts/runpod-deploy.py – bei Abweichung warnt der Deploy.
          RUNPOD_WORKERS_MIN: '0'
          RUNPOD_WORKERS_MAX: '1'
          RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PAT_ALL_ACCESS || secrets.GHCR_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/runpod-deploy.py
