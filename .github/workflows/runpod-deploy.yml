name: runpod-deploy

on:
  workflow_dispatch:
    inputs:
      role:
        description: 'Nur eine Rolle deployen (leer = alle drei)'
        required: false
        default: ''
        type: string
      idle_timeout:
        description: 'Idle-Timeout in Minuten (Auto-Shutdown bei Untätigkeit)'
        required: false
        default: '15'
        type: string
  push:
    # SSOT ist `main`; `runpod-migration` bleibt als historischer Deploy-Branch
    # erlaubt, damit alte Pushes nicht ins Leere laufen.
    branches: [main, runpod-migration]
    paths:
      - 'services/samplemonk-ai-runtime/**'
      - '.github/workflows/runpod-deploy.yml'
      - 'scripts/runpod-deploy.py'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samplemonk-ai-runtime-runpod

jobs:
  # Ein Image für alle drei Rollen – die Rolle wird zur Laufzeit über AI_ROLE
  # und das Rollen-Manifest gewählt (siehe docs/RUNPOD_AI_V1_SPEC.md).
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Runner-Speicher freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: GHCR Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-URL bestimmen
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"

      # Betreiberentscheidung 2026-09-10: Das Einbacken der 29,5 GB Qwen3-14B-
      # Gewichte ist ZURUECKGEZOGEN. Es loeste ein Problem, das mit der Vorgabe
      # "Kaltstart < 15 min genuegt" nicht mehr existiert: GEMESSEN war der erste
      # echte llm-Aufruf am Brain inklusive Download, Modell-Load und 64 Tokens
      # nach 201 s fertig (delay 71 s + exec 58 s). Der Rest ist Worker-
      # Provisionierung, nicht der Download. Damit entfaellt der 30-GB-CI-Build,
      # der dreimal fehlschlug, und alle drei Rollen nutzen EIN Image.
      - name: Build & Push (shared – ears + voiceGen)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: services/samplemonk-ai-runtime
          file: services/samplemonk-ai-runtime/Dockerfile.runpod
          push: true
          build-args: |
            AI_INSTALL_AUDIO_AI=1
            AI_INSTALL_VOICE_AI=1
            AI_INSTALL_VLLM=0
            AI_BAKE_ROLE=
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: GHCR-Paket öffentlich machen (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public \
          || echo "INFO: Paket bleibt privat – GHCR_USERNAME/GHCR_PASSWORD werden benötigt."

      # ---------------------------------------------------------------------
      # Abhängigkeits-Proben
      # ---------------------------------------------------------------------
      # Jede Probe ist ein eigener Step mit `continue-on-error`, damit der
      # Step-Status (auch ohne Log-Zugriff auswertbar) zeigt, WELCHER Import
      # kaputt ist. Genau daran ist der Brain-LLM-Task gescheitert
      # (`MODEL_UNAVAILABLE`, weil `_require_lib` einen ImportError fängt).
      - name: Probe 1 – torch importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import torch; print(torch.__version__)"

      - name: Probe 2 – transformers über den Worker-Pfad (_require_lib)
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "from handlers_runpod import _require_lib; print('require_lib ok', _require_lib('transformers','transformers').__version__)"

      - name: Probe 3 – transformers kennt Qwen3-14B
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "from transformers import AutoConfig; print(AutoConfig.from_pretrained('Qwen/Qwen3-14B').model_type)"

      - name: Probe 3b – huggingface-hub Version
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import huggingface_hub; print(huggingface_hub.__version__)"

      - name: Probe 4 – soundfile + scipy importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import soundfile, scipy; print(soundfile.__version__, scipy.__version__)"

      - name: Probe 5 – diffusers importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import diffusers; print(diffusers.__version__)"

      - name: Probe 6 – pyannote.audio importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import pyannote.audio; print('ok')"

      - name: Probe 7 – qwen_tts importierbar
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import qwen_tts; print('ok')"

      - name: Probe 8 – Worker-Handler-Tabelle läd
        continue-on-error: true
        run: docker run --rm --entrypoint python "${{ needs.build.outputs.image }}:${{ github.sha }}" -c "import handlers; print('llm' in handlers.HANDLERS, sorted(handlers.HANDLERS))"

  # Alle drei Rollen-Endpoints. workers_min bleibt 0 (Scale-to-Zero); der
  # Session-Wake hebt es beim Studio-Eintritt temporär auf 1.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: RunPod SDK installieren
        run: python3 -m pip install --quiet runpod==1.12.0

      - name: Preflight – Pflicht-Secrets prüfen
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
        run: |
          if [ -z "${RP_API_KEY:-}" ]; then
            echo "::error::Repo-Secret RP_API_KEY fehlt oder ist leer – RunPod-Deploy nicht möglich (siehe logs/run-2026-09-10/RUN_PROTOKOLL.md)."
            echo "Lokal funktioniert das Deploy stattdessen mit:"
            echo "  IMAGE=<ghcr-image> RUNPOD_GPU_ID=AMPERE_48 RUNPOD_IDLE_TIMEOUT=15 python3 scripts/runpod-deploy.py"
            exit 1
          fi
          echo "RP_API_KEY ist gesetzt."

      - name: RunPod Serverless Endpoints deployen
        env:
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          RUNPOD_ROLE: ${{ github.event.inputs.role }}
          # RunPod verlangt GPU-POOL-IDs (nicht Marketing-Namen). A6000 48 GB = AMPERE_48.
          RUNPOD_GPU_ID: AMPERE_48
          RUNPOD_WORKERS_MIN: '0'
          RUNPOD_WORKERS_MAX: '1'
          # 15 min Untätigkeit → Worker fährt herunter (Auto-Shutoff).
          RUNPOD_IDLE_TIMEOUT: ${{ github.event.inputs.idle_timeout || '15' }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PAT_ALL_ACCESS || secrets.GHCR_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/runpod-deploy.py
