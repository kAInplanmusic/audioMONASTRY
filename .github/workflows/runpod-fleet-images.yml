name: runpod-fleet-images
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: case "$PROFILE" in voice|executor) ;; *) exit 2 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free runner storage
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: services/audiomonastry-ai-runtime
          file: services/audiomonastry-ai-runtime/Dockerfile.fleet
          target: ${{ inputs.profile }}
          push: true
          tags: ghcr.io/kainplanmusic/audiomonastry-ai-runtime-runpod:fleet-${{ inputs.profile }}-${{ github.sha }}
