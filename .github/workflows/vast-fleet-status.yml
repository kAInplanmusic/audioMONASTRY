name: vast-fleet-status
on:
  workflow_dispatch:
    inputs:
      label_timestamp:
        description: Exact label timestamp of the existing owned fleet (no instances created)
        required: true
        type: string
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      AI_POD_TOKEN: ${{ secrets.AI_POD_TOKEN }}
      FLEET_LABEL_TIMESTAMP: ${{ inputs.label_timestamp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/vast-fleet-status.py --label-timestamp "$FLEET_LABEL_TIMESTAMP"
