name: Build & Verify (Google-frei)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install
        # NOSONAR: Lifecycle-Skripte (mediasoup/esbuild) werden für den Build benötigt
        run: npm ci

      - name: Build
        run: npm run build

      - name: UI-Bundle-Budget prüfen
        run: npm run check:bundle

      - name: React.memo-Audit (Terminals)
        run: npm run check:memo

      - name: Verify no Google/Firebase imports remain
        run: |
          if grep -rniE "from ['\"]@google|from ['\"]firebase|firebase-admin|google-genai|@google-cloud" src server.ts --include='*.ts' --include='*.tsx' --include='*.js'; then
            echo "❌ Google/Firebase import found in code!"; exit 1
          else
            echo "✅ Keine Google/Firebase-Imports in src/server.ts."
          fi

  compose:
    # PROD-P0-004: Deploy-Manifeste duerfen nicht erst auf dem Server brechen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compose-Dateien validieren (inkl. SFU-Overlay)
        env:
          SFU_ANNOUNCED_IP: 127.0.0.1
        run: |
          set -e
          # Die Compose-Dateien binden `env_file: .env` ein; die Datei ist
          # gitignored und fehlt daher im CI-Checkout - `docker compose config`
          # bricht dann mit "env file ... not found" ab (genau das liess diesen Job
          # scheitern). Fuer die Syntaxpruefung genuegt eine leere Datei; Werte
          # braucht die Validierung nicht.
          [ -f .env ] || { echo "lege leere .env fuer die Validierung an"; : > .env; }
          # Fehlerdiagnose: `config --quiet` verschluckt die Meldung, und der Job
          # scheiterte in der CI nur mit "exit code 1" (Log nicht mehr abrufbar).
          # Deshalb wird im Fehlerfall die vollstaendige Ausgabe gedruckt.
          validate() {
            echo "--- $*"
            if ! docker compose "$@" config --quiet; then
              echo "FEHLER in: docker compose $*"
              docker compose "$@" config
              return 1
            fi
          }
          validate -f docker-compose.yml
          validate -f docker-compose.hetzner.yml
          validate -f docker-compose.ai.yml
          validate -f docker-compose.monitoring.yml
          echo "--- Overlay docker-compose.hetzner.yml + docker-compose.sfu.yml"
          validate -f docker-compose.hetzner.yml -f docker-compose.sfu.yml
          # F6: coturn als Service (Rolle sfu) - eigenes Overlay, auch allein.
          echo "--- Overlay docker-compose.turn.yml (Standalone) + mit hetzner/sfu"
          validate -f docker-compose.turn.yml
          validate -f docker-compose.hetzner.yml -f docker-compose.sfu.yml -f docker-compose.turn.yml
          # NOMEN-P1-001: Die Overlays wurden bisher NICHT geprueft - genau daher
          # kam "service X has neither an image nor a build context". Jetzt werden
          # alle Overlay-Paare validiert (inkl. Profil `fleet`, sonst gilt `redis`
          # als undefinierter Service).
          echo "--- Overlay docker-compose.hetzner.yml + docker-compose.fleet-test.yml (Profil fleet)"
          validate -f docker-compose.hetzner.yml -f docker-compose.fleet-test.yml --profile fleet
          echo "--- Overlay docker-compose.monitoring.yml + docker-compose.monitoring.proof.yml"
          validate -f docker-compose.monitoring.yml -f docker-compose.monitoring.proof.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Der Secret-Scan sieht sonst nur den letzten Commit.
          fetch-depth: 0

      - name: Secret-Scan (gitleaks)
        # Vorher: gitleaks/gitleaks@02808f45... - eine Docker-Action, die gitleaks im CI
        # aus dem Quellcode baut. Das brach ab ('git describe --tags' ohne Tags in einem
        # Shallow-Checkout -> leerer VERSION -> Go-Link fehlgeschlagen, 'Docker build
        # failed with exit code 1'). gitleaks-action@v2 (SHA-Pin) nutzt das fertige Binary.
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install
        # NOSONAR: Lifecycle-Skripte (mediasoup/esbuild) werden für den Build benötigt
        run: npm ci

      - name: TypeScript-Check
        run: npm run lint

      - name: ffmpeg installieren (Audio-Gate PROD-P1-002)
        # Die GitHub-Runner bringen ffmpeg NICHT mit; ohne diese Zeile faellt
        # tests/audioGate.test.ts mit 'spawnSync ffmpeg ENOENT' um.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Vitest-Suite (ohne stille Skips)
        # CI-P1-001: Report + Gate gegen übersprungene/todo-Tests.
        run: npm run test:ci

      - name: Interface-Boundary-Scan
        run: node scripts/validate-interface-boundaries.mjs

      - name: spatialMONK Audio-Regression
        run: npx tsx scripts/spatial-regression.ts

      - name: Upload spatial regression WAVs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spatial-regression-wavs
          path: test-results/spatial-regression/
          retention-days: 7

      - name: Stress-/SFU-Skripte Syntax-Check
        run: |
          node --check scripts/hetzner/stress-test.mjs
          node --check scripts/hetzner/sfu-stress-test.mjs
          node --check scripts/hetzner/sfu-rtp-run.mjs
          node --check scripts/hetzner/sfu-rtp-multi-run.mjs
          node --check scripts/hetzner/sfu-rtp-entry.js

      - name: SFU-RTP-Testbundle bauen
        run: npm run build:sfu-test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # DCT-124: Browser-Matrix komplett (Chromium/Firefox/WebKit).
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install
        # NOSONAR: Lifecycle-Skripte (mediasoup/esbuild) werden für den Build benötigt
        run: npm ci

      - name: Worklets bauen
        run: node build-worklets.mjs

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: E2E (ohne visuelle Baselines)
        # CI-P1-001: `--forbid-only`, damit ein versehentliches `test.only` nicht
        # den Rest der Suite stillschweigend aus dem Lauf nimmt. Begründete
        # bedingte Skips (`test.skip(bedingung, 'Grund')`) bleiben erlaubt.
        #
        # Der Signalisierungs-Server faehrt fail-closed: ohne Token UND ohne
        # expliziten Dev-/Test-Modus blockt er API und Socket ausser /api/health.
        # Genau das liess in der CI alle Session-Tests scheitern (Log: "FATAL:
        # STUDIO_ACCESS_TOKEN fehlt und kein expliziter Dev-/Test-Modus aktiv").
        # Fuer den E2E-Lauf setzt der Job einen Test-Token (siehe unten).
        env:
          # Test-Token fuer die CI. Wichtig: bewusst NICHT der Dev-No-Auth-Weg -
          # /api/session/reset verlangt den Token auch im Dev-Modus (bewusste
          # Invariante, abgesichert durch tests/server.test.ts). Das `studio`-Cookie
          # verteilt playwright.config.ts (use.storageState) an ALLE Kontexte.
          STUDIO_ACCESS_TOKEN: e2e-ci-test-token
          # Rate-Limit fuer den E2E-Lauf hochsetzen: der Limiter schluesselt pro
          # Studio-Token/IP, und die ganze Suite laeuft unter EINEM Schluessel
          # (Standard: 60 Requests/Minute) - im CI-Lauf endete das in
          # '429 Too many requests' beim Session-Reset und liess die Session-Tests
          # scheitern. Nur fuer den Testlauf, nicht in Produktion.
          API_RATE_LIMIT_MAX: '100000'
        run: npx playwright test --browser=${{ matrix.browser }} --grep-invert "Baseline" --forbid-only

      - name: E2E-Artefakte hochladen (Audio-Gate, Traces, Report)
        # CI-P1-001: offener Punkt „Audio-Artefakte aus CI hochladen".
        # Auch bei Fehlschlag hochladen — gerade dann sind sie die Beweislage.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-${{ matrix.browser }}-audio-artifacts
          path: |
            test-results/
            playwright-report/
            reports/audio-gate.json
            reports/*.wav
          if-no-files-found: ignore
          retention-days: 14
