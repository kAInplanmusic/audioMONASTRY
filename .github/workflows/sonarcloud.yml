name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # CI-2026-11-06-001: bewusst KEIN sparse-checkout mehr.
          #
          # Die hier frueher gepflegte Pfadliste war die Fehlerquelle: sie nannte
          # 'public/assets/wasm/dspKernel.wasm' (real: 'public/wasm/dspKernel.wasm')
          # und liess u. a. docs/, deploy/, deploy.sh, index.html, vite.config.ts,
          # die docker-compose*.yml, .env*.example, MASTERTODOENDE.json, AGENTS.md,
          # README.md, data/, public/data/ und reports/ weg. Folge: 'Tests with
          # coverage' (npm run test:coverage = volle Suite) starb mit ENOENT,
          # z. B. in dspKernelWasm, pwaManifest, podFleetConfig, namingConventions,
          # noRetiredSecrets, buildPublicAssets, docReferences, moaBoundary.
          #
          # Ein Sparse-Checkout spart in diesem Repo nichts: die GB unter public/
          # (music, models, data) sind untracked/gitignored, nur getrackte Dateien
          # landen ueberhaupt im CI-Checkout. Der getrackte Baum ist ~40 MB /
          # ~1930 Dateien (davon public/ 16,7 MB). Ein voller Checkout ist damit
          # genauso klein - und er bricht nicht, sobald ein neuer Pfad dazukommt.
          # Wenn hier je wieder eingeschraenkt wird: cone-Modus verwenden (dann
          # sind Root-Dateien immer dabei) und die Liste gegen `npm test` pruefen.

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: ffmpeg installieren (Audio-Gate PROD-P1-002)
        # Tests with coverage laufen ueber tests/audioGate.test.ts -> braucht ffmpeg;
        # die GitHub-Runner bringen es nicht mit.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
