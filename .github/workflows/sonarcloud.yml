name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Sparse-Checkout: nur die Verzeichnisse laden, die Sonar/Tests brauchen.
          # Das public/-Verzeichnis (~674 MB Musik/Modelle) wird NICHT geladen.
          # Full repo except massive public media. The coverage tests introspect
          # docs, deploy, compose files, shared schemas and tracked fixtures.
          # Enumerating a handful of paths previously caused false CI failures.
          sparse-checkout: |
            src
            server
            services
            scripts
            tests
            server.ts
            sonar-project.properties
            package.json
            package-lock.json
            vitest.config.ts
            tsconfig.json
            # Von Tests gelesen, aber zusammen nur einige KB (public/ selbst bleibt
            # aussen vor: 3,4 GB Musik/Modelle):
            public/hrtf
            public/plugin-manifest.json
            public/manifest.webmanifest
            public/assets/icon-192.png
            public/assets/icon-512.png
            public/assets/icon-maskable-512.png
            public/assets/apple-touch-icon.png
            public/assets/wasm/dspKernel.wasm
            database
            # Required by server/routes and the test suite; omission caused
            # ERR_MODULE_NOT_FOUND/ENOENT in coverage on prior PRs.
            shared
            supabase/migrations
            docker-compose.hetzner.yml
            .github
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: ffmpeg installieren (Audio-Gate PROD-P1-002)
        # Tests with coverage laufen ueber tests/audioGate.test.ts -> braucht ffmpeg;
        # die GitHub-Runner bringen es nicht mit.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
