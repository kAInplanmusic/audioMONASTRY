name: authorized-one-shot-production-20261117
on:
  push:
    branches: [deploy/one-shot-production-20261117-1711]
    paths: [.github/workflows/authorized-one-shot-production-20261117.yml]
permissions:
  contents: read
concurrency:
  group: audiomonastry-authorized-production-one-shot-20261117
  cancel-in-progress: false
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HETZNER_PRODUCTION_TOKEN: ${{ secrets.HETZNER_PRODUCTION_TOKEN }}
      AUDIO_PROD_SSH_KEY: ${{ secrets.AUDIO_PROD_SSH_KEY }}
      AUDIO_PROD_PROVIDER_ENV: ${{ secrets.AUDIO_PROD_PROVIDER_ENV }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
      CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify production prerequisites without allocating anything
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          policy=json.loads(pathlib.Path('deploy/gpu-provider.json').read_text())
          if policy.get('provider') != 'vast' or float(policy.get('maxTotalEurPerHour',99))>8: raise SystemExit('GPU_POLICY_BLOCK')
          if not pathlib.Path('scripts/production/idle-policy.py').read_text().count("'IDLE_MINUTES':'30'"): raise SystemExit('IDLE_POLICY_BLOCK')
          needed=['HETZNER_PRODUCTION_TOKEN','AUDIO_PROD_SSH_KEY','AUDIO_PROD_PROVIDER_ENV','GHCR_PASSWORD']
          missing=[k for k in needed if not os.environ.get(k)]
          if missing: raise SystemExit('MISSING_RUNNER_SECRETS:'+','.join(missing))
          provider_env=json.loads(os.environ['AUDIO_PROD_PROVIDER_ENV'])
          if not (os.environ.get('CF_DNS_API_TOKEN') or provider_env.get('CF_DNS_API_TOKEN')):
              raise SystemExit('MISSING_CLOUDFLARE_DNS_TOKEN')
          result=subprocess.run(['python3','scripts/production/deploy.py','--mode','inspect'],text=True,capture_output=True,timeout=120)
          if result.returncode:
              import re
              codes=re.findall(r'HETZNER_HTTP_[0-9]+:[a-z_]+|[A-Z][A-Z0-9_]{5,}',result.stderr)
              raise SystemExit('PRODUCTION_INSPECT_FAILED:'+','.join(codes[-4:]))
          docs=[]
          for line in result.stdout.splitlines():
              try: docs.append(json.loads(line))
              except ValueError: pass
          expected=next((x['expectedNodes'] for x in docs if isinstance(x,dict) and 'expectedNodes' in x),None)
          missing_vars=next((x['missingProviderVariables'] for x in docs if isinstance(x,dict) and 'missingProviderVariables' in x),None)
          balance=next((x for x in docs if isinstance(x,dict) and 'vastBalanceUsd' in x),None)
          snapshots=next((x['roleSnapshots'] for x in docs if isinstance(x,dict) and 'roleSnapshots' in x),[])
          if not expected or len(expected)!=4: raise SystemExit('HETZNER_INVENTORY_MISSING')
          if missing_vars is None or missing_vars: raise SystemExit('PROVIDER_SECRETS_INCOMPLETE:'+','.join(missing_vars or ['unknown']))
          if not balance: raise SystemExit('VAST_ACCOUNT_UNVERIFIED')
          credit=float(balance.get('vastCreditUsd') or 0)
          funds=float(balance.get('vastBalanceUsd') or 0)+credit
          if funds<6: raise SystemExit('VAST_AVAILABLE_CREDIT_BELOW_6_USD')
          for node in expected:
              if not node.get('present') and not any(node['role'] in str(s.get('description','')) for s in snapshots):
                  raise SystemExit('MISSING_RESTORABLE_SNAPSHOT:'+node['role'])
          print('PREDEPLOY_PASS: four Hetzner roles recoverable, provider secrets present, Vast credit sufficient and 8 EUR/h cap active')
          print('Node states:', [(x['role'],x['status']) for x in expected])
          PY
  deploy-and-verify:
    needs: assess
    runs-on: ubuntu-latest
    timeout-minutes: 89
    env:
      HETZNER_PRODUCTION_TOKEN: ${{ secrets.HETZNER_PRODUCTION_TOKEN }}
      AUDIO_PROD_SSH_KEY: ${{ secrets.AUDIO_PROD_SSH_KEY }}
      AUDIO_PROD_PROVIDER_ENV: ${{ secrets.AUDIO_PROD_PROVIDER_ENV }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
      CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
      CFS3_ACCESS_KEY: ${{ secrets.CFS3_ACCESS_KEY }}
      CFS3_SECRET_KEY: ${{ secrets.CFS3_SECRET_KEY }}
      CFS3_BUCKET: ${{ secrets.CFS3_BUCKET }}
      CFS3_ENDPOINT: ${{ secrets.CFS3_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore, deploy, install 30m lifecycle, verify CPU/RT/RTP/GPU, and clean up Vast
        run: python3 -u scripts/production/deploy.py --mode full
      - name: Collect sanitized evidence
        if: always()
        run: python3 scripts/production/collect-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-evidence-one-shot
          path: production-evidence/summary.json
          retention-days: 30
  gpu-cleanup:
    needs: [assess, deploy-and-verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Independently destroy rental for this GitHub run
        run: python3 scripts/production/cleanup-run.py
