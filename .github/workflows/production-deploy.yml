name: production-deploy
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect existing nodes or deploy the current checkout
        type: choice
        options: [inspect, restore, diagnose, deploy, verify, ai, full, rt, rtp]
        default: inspect
permissions:
  contents: read
concurrency:
  group: audiomonastry-production-deploy
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HETZNER_PRODUCTION_TOKEN: ${{ secrets.HETZNER_PRODUCTION_TOKEN }}
      AUDIO_PROD_SSH_KEY: ${{ secrets.AUDIO_PROD_SSH_KEY }}
      AUDIO_PROD_PROVIDER_ENV: ${{ secrets.AUDIO_PROD_PROVIDER_ENV }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
      CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -u scripts/production/deploy.py --mode '${{ inputs.mode }}'
      - name: Collect sanitized immutable-run evidence
        if: always() && inputs.mode == 'full'
        env:
          CFS3_ACCESS_KEY: ${{ secrets.CFS3_ACCESS_KEY }}
          CFS3_SECRET_KEY: ${{ secrets.CFS3_SECRET_KEY }}
          CFS3_BUCKET: ${{ secrets.CFS3_BUCKET }}
          CFS3_ENDPOINT: ${{ secrets.CFS3_ENDPOINT }}
        run: python3 scripts/production/collect-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.mode == 'full'
        with:
          name: production-evidence
          path: production-evidence/summary.json
          retention-days: 30
  cleanup:
    needs: production
    if: always() && (inputs.mode == 'ai' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/production/cleanup-run.py
