# audioMONASTRY – AI Runtime (eigene Runtime, lokal/Hetzner/Runpod)
# =================================================================
# Baut und startet den Custom Container (CPU/Simulationsmodus für Smoke-Tests,
# AI_RUNTIME_DEVICE=cuda auf einem GPU-Host). Produktion: eigene Runtime auf der
# GPU-Flotte (Runpod), angesprochen über VOICE_AI_RUNTIME_URL – KEIN
# HF-Inference-Endpoint mehr (AI nur lokal, RT-AUDIT-P1-014).
services:
  ai-runtime:
    build:
      context: ./services/audiomonastry-ai-runtime
    container_name: audiomonastry-ai-runtime
    environment:
      AI_RUNTIME_DEVICE: simulated   # cuda auf GPU-Host, simulated für Smoke-Tests
      HF_HOME: /data/hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
      AI_MODEL_MANIFEST: /opt/audiomonastry-ai/model_manifest.json
    volumes:
      - ai-model-cache:/data/hf-cache
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  ai-model-cache:
