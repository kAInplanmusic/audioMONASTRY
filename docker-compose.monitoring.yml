# =============================================================================
# audioMONASTRY · docker-compose.monitoring.yml – optionales Observability-Stack
# -----------------------------------------------------------------------------
# High-End-Monitoring für den Hetzner-Betrieb (edge-1 oder eigener Knoten):
#   - node-exporter : Host-Metriken (CPU/RAM/Disk/Netz)
#   - cadvisor      : Container-Metriken (CPU/RAM/Netz je Service)
#   - prometheus    : Scraping + Alerting-Grundlage
#   - grafana       : Dashboards (Login: admin / GF_SECURITY_ADMIN_PASSWORD)
#
# Start:
#   docker compose -f docker-compose.hetzner.yml -f docker-compose.monitoring.yml \
#     up -d node-exporter cadvisor prometheus alertmanager grafana
#
# Danach:
#   Grafana:  ssh -L 3000:127.0.0.1:3000 root@<edge-1-IP>  ->  http://127.0.0.1:3000
#             (Login: admin / GF_SECURITY_ADMIN_PASSWORD)
#
# Hinweise:
#   - INFRA-HETZNER-006: IMMER mit expliziter Service-Liste starten. Ohne Liste
#     zieht die Basisdatei `caddy` + `audiomonastry` + `master-player` mit
#     (4672 MiB Speicher-Limits auf einem 4-GB-cx23) - edge-1 soll keinen
#     App-Traffic und keinen zweiten Caddy fuer dieselbe Domain tragen.
#   - Prometheus (9090) und Alertmanager (9093) bleiben rein intern (`expose`):
#     kein veroeffentlichter Port, keine Firewall-Regel. Ein Zugriff von aussen
#     braucht bewusst einen eigenen Tunnel/Proxy.
#   - Bereits benutzte Knoten: ein ALTES Rollen-Snapshot bootet seine Container
#     per `restart: unless-stopped` selbst wieder hoch - dann einmalig
#     `docker compose -f docker-compose.hetzner.yml -f docker-compose.monitoring.yml
#      stop caddy audiomonastry master-player` ausfuehren und ein frisches
#     edge-Snapshot ziehen (bring-up-fleet.sh stoppt sie beim Flottenstart selbst).
#   - Persistenz: benannte Volumes (prometheus_data, grafana_data).
# =============================================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime: &default-runtime
  restart: unless-stopped
  logging: *default-logging
  init: true
  security_opt:
    - no-new-privileges:true

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: audiomonastry-node-exporter
    <<: *default-runtime
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    expose:
      - "9100"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: audiomonastry-cadvisor
    <<: *default-runtime
    privileged: true          # cAdvisor benötigt Host-Zugriff für cgroups
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # INFRA-HETZNER-004: Scrape-Ziel ist die PRODUKTIONS-App (app-1), nicht der
  # lokale Container. Default = Domain ueber Floating-IP; fuer den lokalen
  # edge-only-Betrieb (Monitoring neben der App) beide Werte umstellen:
  #     APP_TARGET=audiomonastry:8080 APP_SCHEME=http
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: audiomonastry-prometheus
    <<: *default-runtime
    volumes:
      - prometheus_data:/prometheus
      - ./scripts/hetzner/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./scripts/hetzner/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
    # PROD-P1-004 (Befund 2026-09-18): `--config.expand-env` gibt es bei
    # Prometheus NICHT (Startabbruch: "unknown long flag", Stack in der
    # Restart-Schleife), und Prometheus expandiert Umgebungsvariablen in der
    # Konfiguration grundsaetzlich nicht. Die Platzhalter __SCRAPE_TOKEN__,
    # __APP_TARGET__ und __APP_SCHEME__ werden deshalb hier beim Start ersetzt -
    # Secrets und Ziel bleiben damit aus dem Repo heraus.
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|__SCRAPE_TOKEN__|$${SCRAPE_TOKEN}|g"
        -e "s|__APP_TARGET__|$${APP_TARGET}|g"
        -e "s|__APP_SCHEME__|$${APP_SCHEME}|g" /etc/prometheus/prometheus.yml
        > /tmp/prometheus.yml &&
        exec /bin/prometheus
        --config.file=/tmp/prometheus.yml
        --storage.tsdb.retention.time=15d
        --web.enable-lifecycle
    environment:
      # PROD-P0-001: gleiches Secret wie in der App (server.ts SCRAPE_TOKEN).
      SCRAPE_TOKEN: ${SCRAPE_TOKEN:-}
      # INFRA-HETZNER-004: Dokumentierte Defaults - ein Satz Dateien fuer Flotte
      # UND lokalen Betrieb. Ohne APP_TARGET wird die Produktions-Domain
      # gescraped (app-1 hinter der Floating-IP), nicht der edge-Container.
      APP_TARGET: ${APP_TARGET:-anunnakitools.de}
      APP_SCHEME: ${APP_SCHEME:-https}
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Prometheus-Alerts → Chat-Webhook (Discord/Slack/Telegram via App-Endpoint
  # /api/alerts/webhook; Konfiguration siehe scripts/hetzner/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: audiomonastry-alertmanager
    <<: *default-runtime
    volumes:
      - ./scripts/hetzner/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # PROD-P1-004: gleiche Rendering-Regel wie bei Prometheus. Ohne gesetztes
    # CRITICAL_WEBHOOK zeigt der Fallback auf den Produktions-Webhook (Domain) -
    # ein App-Down-Alarm geht damit an die Produktion, nicht an den lokalen
    # edge-Container (INFRA-HETZNER-004: Fallback = Produktions-Route).
    # ACHTUNG: EINZEILIG halten. Ein gefalteter YAML-Block mit tiefer
    # eingerueckten Folgezeilen behaelt den Zeilenumbruch - der sed-Befehl wurde
    # dadurch in drei Shell-Befehle zerlegt ('-e: not found',
    # '/etc/alertmanager/alertmanager.yml: Permission denied').
    entrypoint:
      - /bin/sh
      - -c
      - sed -e "s|__CRITICAL_WEBHOOK__|$${CRITICAL_WEBHOOK:-https://anunnakitools.de/api/alerts/webhook}|g" -e "s|__ALERT_WEBHOOK_URL__|$${ALERT_WEBHOOK_URL:-https://anunnakitools.de/api/alerts/webhook}|g" -e "s|__ALERT_WEBHOOK_TOKEN__|$${ALERT_WEBHOOK_TOKEN:-}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    environment:
      # Direkter Chat-Webhook fuer Alarme, die die App selbst betreffen
      # (App-Down laesst sich nicht ueber die App zustellen).
      CRITICAL_WEBHOOK: ${CRITICAL_WEBHOOK:-}
      # INFRA-HETZNER-004: Ziel des Chat-Webhooks. Default = Produktions-Endpoint.
      # Lokal (edge-only, Monitoring neben der App): ALERT_WEBHOOK_URL=http://audiomonastry:8080/api/alerts/webhook
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-https://anunnakitools.de/api/alerts/webhook}
      # Gemeinsames Geheimnis mit der App (server.ts ALERT_WEBHOOK_TOKEN).
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    expose:
      - "9093"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: audiomonastry-grafana
    <<: *default-runtime
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/hetzner/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./scripts/hetzner/grafana-dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    # INFRA-HETZNER-007: Grafana ist das einzige Monitoring-Werkzeug mit einem
    # Bediener-Zugang. Statt Port 3000 in der Hetzner-Firewall zu oeffnen (die
    # Live-Gegenprobe zeigt: `audiomonastry-edge` hat nur icmp/22/80/443), wird
    # er NUR auf die Loopback-Adresse des Knotens gebunden. Damit ist kein
    # oeffentlicher Port und keine Firewall-Regel noetig:
    #   ssh -L 3000:127.0.0.1:3000 root@<edge-1-IP>  ->  http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  prometheus_data:
  grafana_data:
