# =============================================================================
# audioMONASTRY – SonarCloud / SonarQube Cloud Konfiguration (CI-Scan)
# -----------------------------------------------------------------------------
# Automatic Analysis ist für dieses Projekt deaktiviert; Analyse läuft über
# .github/workflows/sonarcloud.yml mit SONAR_TOKEN (Repository-Secret).
# Stand: 2026-11-21 (Aufräum-Lauf)
# =============================================================================

sonar.organization=audiomonastry
sonar.projectKey=kAInplanmusic_audioMONASTRY
sonar.projectName=audioMONASTRY
sonar.sources=src,server,services,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/models/**,**/*.min.js,**/__pycache__/**,tests/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage-Ausschlüsse: nur UI-Terminals, Audio-Worklets und Browser-/DSP-Adapter
# werden bewusst nicht unit-getestet (UI-/Audio-Thread-Code). Der Fokus der
# Coverage-Metrik liegt auf Core-/Server-/KI-Logik.
# Reduziert 2026-11-21: vorherige Liste war übertrieben breit und schloss
# fast die gesamte Codebase von der Coverage-Metrik aus.
sonar.coverage.exclusions=\
  src/components/**,\
  src/App.tsx,\
  src/main.tsx,\
  src/audio/worklets/**,\
  src/webgpu/**,\
  src/core/audio/WebAudioBackend.ts

# SCM-Blame: deaktiviert, da CI-Checkout nicht alle Git-Blobs lädt.
sonar.scm.disabled=true