# =============================================================================
# sampleMONK – SonarCloud / SonarQube Cloud Konfiguration (CI-Scan)
# -----------------------------------------------------------------------------
# Automatic Analysis ist für dieses Projekt deaktiviert; Analyse läuft über
# .github/workflows/sonarcloud.yml mit SONAR_TOKEN (Repository-Secret).
# =============================================================================
sonar.organization=audiomonastry
sonar.projectKey=kAInplanmusic_sampleMONK
sonar.projectName=sampleMONK
sonar.sources=src,server,services,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/models/**,**/*.min.js,**/__pycache__/**,tests/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage-Exclusions: UI-Terminals, Audio-Worklets und Browser-/DSP-Adapter
# werden bewusst nicht unit-getestet (UI-/Audio-Thread-Code); der Fokus der
# Coverage-Metrik liegt auf Core-/Server-/KI-Logik.
# Coverage-Exclusions: UI, Browser-Adapter, Worklets, Legacy-AI und nicht
# unit-getestete Infrastruktur. Coverage-Fokus liegt auf der getesteten
# KI-/Voice-/Session-/Render-/Server-Logik.
sonar.coverage.exclusions=server.ts,server/**,src/components/**,src/App.tsx,src/main.tsx,src/context/**,src/hooks/**,src/lib/**,src/plugins/**,src/data/**,src/types/**,src/config/**,src/presets.ts,src/audio/**,src/workers/**,src/webgpu/**,src/ai/**,src/utils/**,services/**,scripts/**,src/core/gpu/**,src/core/native/**,src/core/hardware/**,src/core/edge/**,src/core/instrument/**,src/core/transport/**,src/core/output/**,src/core/spatial/**,src/core/audio/**,src/core/adapters.ts,src/core/index.ts,src/core/interfaces.ts,src/core/WebAudioBackend.ts,src/core/computeLocal.ts,src/core/voice/SingingEngine.ts
# Sparse-Checkout lädt nicht alle Git-Blobs; SCM-Blame daher deaktivieren.
sonar.scm.disabled=true
