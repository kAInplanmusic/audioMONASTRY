[project]
name = "samplemonk-ai-runtime"
version = "1.0.0"
description = "SampleMONK AI Runtime (Hugging Face Custom Container)"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  # torch wird bewusst NICHT hier gependelt: kommt aus dem Basisimage
  # (pytorch/pytorch:2.4.1-cuda12.4-cudnn9-runtime) – siehe requirements.lock.
  "transformers>=4.44,<5",
  "soundfile>=0.12",
  "scipy>=1.13",
  "pyannote.audio>=3.3",
]

[tool.setuptools]
py-modules = ["app", "handlers", "model_manager", "registry", "mcp_runtime"]
