# =============================================================================
# audioMONASTRY – Portal Worker (Weg A: 0 €/Monat)
# -----------------------------------------------------------------------------
# Cloudflare Worker, der auf anunnakitools.de läuft:
#   - Flotte AUS  -> Login-Seite + „Flotte starten"
#   - Start läuft -> Ladebildschirm mit großer Zeit + Status-Schritten
#   - Flotte AN   -> Reverse-Proxy auf app-1 (App/API/WebSocket)
#   - Cron alle 5 min -> löscht die Flotte, sobald app-1 (Idle-Auto-Shutdown)
#                        nach 20 min ohne Nutzung ausgeschaltet wurde.
#
# Secrets (wrangler secret put / .dev.vars):
#   ADMIN_USER, ADMIN_PASSWORD, SESSION_SECRET
#   HCLOUD_TOKEN, SSH_PUBLIC_KEY, GITHUB_TOKEN
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE, SUPABASE_ANON_PUB
#   CFR2_ACCOUNT_ID, CFR2_ACCESS_KEY_ID, CFR2_SECRET_ACCESS_KEY, CFR2_BUCKET, CFR2_PUBLIC_URL
#   REPLICATE_API_TOKEN, DEEPSEEK_API_KEY, HF_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY
# =============================================================================
name = "audiomonastry-portal"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = false

# Route auf der eigenen Zone (nach DNS-Umzug zu Cloudflare):
route = { pattern = "anunnakitools.de/*", zone_name = "anunnakitools.de" }

[triggers]
crons = ["*/5 * * * *"]

# ---------------------------------------------------------------------------
# PROD-P1-F4 - Staleness-Gate (Commit-Paritaet)
# ---------------------------------------------------------------------------
# Ist EXPECTED_COMMIT gesetzt, gilt die Flotte nur als "ready", wenn
# /api/health denselben Commit meldet. Eine Abweichung erscheint als
# state "stale" mit "Flotte laeuft Stand X, Repo ist Y" im Ladebildschirm -
# kein Weiterleiten in das Studio (Befund 2026-09-20: app-1 lief zwei Tage
# hinter dem Repo). "Nicht pruefbar" (Image vor F4 ohne commit-Feld) blockiert
# NICHT, wird aber gemeldet.
# ALLOW_STALE = "1" erlaubt den abweichenden Stand BEWUSST (nur mit Begruendung;
# die Meldung bleibt sichtbar). Ohne beide Werte bleibt der Start moeglich,
# /api/status meldet die Paritaet dann als "nicht pruefbar" - der CLI-Pfad
# (scripts/hetzner/fleet-preflight.sh) uebergibt Erwartung + Freigabe je Aufruf.
# Zum Setzen die Kommentarzeichen entfernen (auch das von [vars]):
# [vars]
# EXPECTED_COMMIT = "ae5e749"
# ALLOW_STALE = "0"
