# audioMONASTRY/services/turn/turnserver.conf (Template)
# Secure configuration for Coturn.
# WICHTIG: Das echte Secret wird NICHT eingecheckt.
# deploy-turn.sh ersetzt den Platzhalter aus $TURN_STATIC_AUTH_SECRET
# oder generiert ein frisches Secret (openssl rand -hex 32).

fingerprint
use-auth-secret
static-auth-secret=__TURN_STATIC_AUTH_SECRET__
realm=monkmonastry.com

# Networking
total-quota=100
bps-capacity=0
stale-nonce

# Relay settings
# Replace with the actual public IP of your TURN server
relay-ip=0.0.0.0
listening-ip=0.0.0.0
listening-port=3478
min-port=49152
max-port=65535

# Logging
log-file=/var/log/turnserver.log
no-loopback-peers
no-multicast-peers
