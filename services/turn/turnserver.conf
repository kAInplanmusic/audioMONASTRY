# audioMONASTRY/services/turn/turnserver.conf (Template)
# Coturn-Konfiguration fuer den WebRTC-Relay (COLLAB-P0-003).
#
# Auth: NUR das coturn-REST-Verfahren (`use-auth-secret`). Der App-Server mintet
# pro Anfrage kurzlebige Credentials (username=<expiry>:<userId>,
# HMAC-SHA1 ueber das Secret) - siehe server/webrtcConfig.ts. Es gibt bewusst
# KEINE statischen Benutzer mehr: ein eingecheckter Default (frueher
# `monk:monkmonastery`) waere ein offenes Relay fuer jeden, der das Repo liest.
#
# Platzhalter, die deploy-turn.sh ersetzt:
#   __TURN_STATIC_AUTH_SECRET__  -> $TURN_STATIC_AUTH_SECRET (Pflicht)
#   __TURN_RELAY_IP__            -> oeffentliche IP des Knotens (Pflicht)
# Das echte Secret wird NICHT eingecheckt.

fingerprint
use-auth-secret
lt-cred-mech
static-auth-secret=__TURN_STATIC_AUTH_SECRET__
realm=anunnakitools.de

# Networking
total-quota=100
bps-capacity=0
stale-nonce

# Relay
relay-ip=__TURN_RELAY_IP__
listening-ip=0.0.0.0
listening-port=3478
# Relay-Portbereich: bewusst NUR 50 Ports (F6). Der Bereich steht in drei
# Stellen gleichzeitig - hier, in der Hetzner-Firewall der Rolle sfu
# (scripts/hetzner/provision.py + services/portal-worker/src/index.js) und in
# docs/HETZNER_DEPLOY.md; tests/test_hetzner_scripts.py haelt sie zusammen.
# 50 Relay-Ports ≙ 50 gleichzeitige Allokationen - fuer 2-8 Spieler mehr als
# ausreichend (eine Allokation je Client; ChannelBindings teilen sich den Port).
# Ein breiterer Bereich bringt keinen Vorteil, macht die Freigabe aber
# unpruefbar ("lauscht der Relay im freigegebenen Bereich?").
min-port=49152
max-port=49201

# Haertung: nicht in private/reservierte Bereiche relayen. Ohne diese Sperren
# kann jeder Client unser Relay als Sonde in interne Netze benutzen - inklusive
# des Hetzner-Privatnetzes der Flotte (10.0.0.0/8).
#
# HINWEIS (F6, 2026-09-20): `no-loopback-peers` ist ab coturn 4.6 kein
# Konfigurationsschluessel mehr (die Sperre ist dort der Default); coturn 4.18
# loggt dazu "WARNING Bad configuration format: no-loopback-peers". Der
# Schluessel bleibt fuer die aeltere apt-/Systemd-Variante (coturn 4.6.x auf
# Ubuntu 24.04) stehen - im Container entfernt wire-rtc.sh ihn beim Erzeugen der
# Laufzeitkonfiguration, damit das Container-Log sauber bleibt.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logging
log-file=/var/log/turnserver.log
