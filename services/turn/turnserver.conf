# /home/painfulltattoo/sample-monk/services/turn/turnserver.conf
# Secure configuration for Coturn

fingerprint
use-auth-secret
# IMPORTANT: Replace with a secure, generated secret
static-auth-secret=f72c3d9a1b8e6c3cdc2d464b120b1912c4eb63e0066284586efdae3a65cb2390
realm=monkmonastry.com

# Networking
total-quota=100
bps-capacity=0
