# audioMONASTRY/services/turn/turnserver.local-proof.conf
# LOKALE BEWEIS-Konfiguration (COLLAB-P0-003) - NICHT fuer den Produktivbetrieb.
#
# Wozu: `services/turn/turnserver.conf` ist die gehaertete Produktionsvorlage. Sie
# verbietet Relay in Loopback-/private Bereiche (`no-loopback-peers` + denied-peer-ip),
# damit das Relay nicht als Sonde in interne Netze dient. Fuer den lokalen Beweis
# laufen beide Peers auf DEMSELBEN Host - eine relay-only-Verbindung ist dort nur
# mit erlaubten Loopback-Peers moeglich. Genau dieser Unterschied war beim ersten
# Beweisversuch sichtbar: der Relay-Kandidat wurde ausgehandelt, die Verbindung
# scheiterte aber an der Peer-Sperre.
#
# Was hier GLEICH ist wie in Produktion (und damit der Beweisgegenstand):
#   - `use-auth-secret` + `static-auth-secret` (coturn-REST-Verfahren)
#   - dieselbe Port-/Fingerprint-Konfiguration
# Unterschieden wird nur die Peer-Policy (Loopback erlaubt) und das Logging.
#
# Aufruf (siehe docs/OPS_RUNBOOK.md, Abschnitt TURN):
#   docker run -d --name am-coturn --network host \
#     -v "$PWD/services/turn/turnserver.local-proof.conf:/etc/coturn/turnserver.conf:ro" \
#     coturn/coturn:latest -c /etc/coturn/turnserver.conf

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=turnproofsecret123
realm=audiomonastry.local
min-port=49160
max-port=49200

# Lokaler Beweis: beide Peers liegen auf diesem Host.
allow-loopback-peers
no-multicast-peers

# Bedienbarkeit im Container
no-cli
no-tls
no-dtls
log-file=stdout
no-software-attribute
