[package]
name = "audiomonastry-runtime"
version = "0.3.0"
edition = "2021"
description = "audioMONASTRY native audio runtime (IPC stdin/stdout, cpal streams, DSP)"

[[bin]]
name = "audiomonastry-runtime"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
base64 = "0.22"
