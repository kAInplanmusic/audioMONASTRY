# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "de-DE"

chat:
  auto_reply: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    base_branches:
      - main

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/logs/**"
    - "!**/*.lock"
    - "!**/public/assets/**"

  path_instructions:
    - path: "src/core/ai/**"
      instructions: |
        - Achte auf korrekte Fehlerbehandlung und Ressourcen-Freigabe im AI-Orchestrator.
        - Prüfe, ob Prompts und Modell-Aufrufe versioniert und konfigurierbar sind.
    - path: "services/**/*.py"
      instructions: |
        - Prüfe FastAPI-Endpunkte auf Input-Validierung, Auth und Rate-Limiting.
        - Achte auf GPU-/Ressourcen-Handling und saubere Shutdown-Pfade.
    - path: "**/*.test.ts"
      instructions: |
        - Prüfe, ob Edge-Cases und Fehlerpfade abgedeckt sind.
        - Tests sollen deterministisch und klar benannt sein.
    - path: "server/**"
      instructions: |
        - Achte auf Authentifizierung, Autorisierung und Rate-Limiting.
        - Prüfe WebSocket-/SFU-Handling auf Race-Conditions und Leaks.

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      mode: off
