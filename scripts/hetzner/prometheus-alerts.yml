# Prometheus-Alerting-Regeln für sampleMONK (Live-Betrieb)
groups:
  - name: samplemonk
    rules:
      - alert: SamplemonkAppDown
        expr: up{job="samplemonk"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "sampleMONK App nicht erreichbar", description: "{{ $labels.instance }} ist seit 2 Minuten down." }

      - alert: SamplemonkHighErrorRate
        expr: rate(samplemonk_http_errors_total[5m]) / rate(samplemonk_http_requests_total[5m]) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Hohe HTTP-Fehlerrate", description: ">10% Fehler über 5 Minuten ({{ $value }})." }

      - alert: SamplemonkStemQueueFull
        expr: samplemonk_stem_jobs_active >= samplemonk_stem_jobs_max
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Stem-Queue voll", description: "Alle Stem-Slots sind seit 10 Minuten belegt." }

      - alert: NodeHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Hoher RAM-Verbrauch", description: "{{ $labels.instance }} nutzt >90% RAM." }

      - alert: NodeHighCpu
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 90
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Hohe CPU-Last", description: "{{ $labels.instance }} >90% CPU über 10 Minuten." }

      # PROD-P2-001: AI-Kosten-Guard. Budget-Regel im SSOT:
      # fleetMaxEurPerHour = 10 (≈ USD). samplemonk_ai_cost_usd ist kumulativ,
      # deshalb increase() über 1 h als Stundenrate.
      - alert: AiCostBudgetBurned
        expr: increase(samplemonk_ai_cost_usd[1h]) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "AI-Kosten-Budget überschritten"
          description: "Geschätzte KI-Kosten der letzten Stunde über Budget: {{ $value }} USD (> 10 USD/h laut SSOT)."

  # ---------------------------------------------------------------------------
  # PROD-P1-004: SLOs als Recording-Rules + Burn-Rate-Alarme.
  # Bis hierher gab es Einzelalarme, aber keine Verfuegbarkeits-/Latenz-Zusage
  # und damit auch keine Messgrundlage ("erfuellen wir unser SLO?").
  # ---------------------------------------------------------------------------
  - name: samplemonk-slo
    interval: 30s
    rules:
      # SLO 1 (Verfuegbarkeit 99,5 % / 24 h): Anteil erfolgreicher HTTP-Antworten.
      - record: samplemonk:slo_availability:ratio_24h
        expr: |
          (
            sum(rate(samplemonk_http_requests_total[24h]))
            - sum(rate(samplemonk_http_errors_total[24h]))
          )
          / clamp_min(sum(rate(samplemonk_http_requests_total[24h])), 1e-9)
      # Kurzes Fenster fuer den schnellen Burn-Rate-Alarm (2 % Fehlerbudget in 1 h).
      - record: samplemonk:slo_availability:ratio_1h
        expr: |
          (
            sum(rate(samplemonk_http_requests_total[1h]))
            - sum(rate(samplemonk_http_errors_total[1h]))
          )
          / clamp_min(sum(rate(samplemonk_http_requests_total[1h])), 1e-9)
      # SLO 2 (Latenz): p95 der HTTP-Requests aus dem Histogramm (30-min-Fenster).
      - record: samplemonk:slo_latency_p95_seconds:30m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(samplemonk_http_request_duration_seconds_bucket[30m]))
          )

      # Burn-Rate-Alarm 1: Verfuegbarkeit unter dem 24-h-Ziel (99,5 %).
      - alert: SamplemonkSloAvailabilityBreach
        expr: samplemonk:slo_availability:ratio_1h < 0.995
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Verfuegbarkeits-SLO verletzt (1 h < 99,5 %)"
          description: "Anteil erfolgreicher Requests in der letzten Stunde: {{ $value | humanizePercentage }} (Ziel 99,5 %)."

      # Burn-Rate-Alarm 2: Latenz-SLO - p95 ueber 250 ms (30 min).
      - alert: SamplemonkSloLatencyBreach
        expr: samplemonk:slo_latency_p95_seconds:30m > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Latenz-SLO verletzt (p95 > 250 ms)"
          description: "p95 der HTTP-Requests ueber 30 Minuten: {{ $value }} s (Ziel < 0,25 s)."

      # Burn-Rate-Alarm 3: Xruns - hoert die Audio-Engine eines Clients auf zu
      # takten, ist das ein Klangproblem, kein Rechenproblem. Schwelle bewusst
      # niedrig (Audio-Artefakte sind sofort hoerbar).
      - alert: SamplemonkClientXruns
        expr: sum(increase(samplemonk_telemetry_xruns_total[10m])) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gehaeufte Audio-Xruns bei Clients"
          description: "{{ $value }} Xruns in 10 Minuten (Telemetrie der Clients) - Audio-Aussetzer pruefen."
