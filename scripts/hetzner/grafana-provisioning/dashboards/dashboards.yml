# Grafana Dashboard-Provisioning für sampleMONK
apiVersion: 1

providers:
  - name: samplemonk
    orgId: 1
    folder: sampleMONK
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
