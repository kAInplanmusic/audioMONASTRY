# Grafana Dashboard-Provisioning für audioMONASTRY
apiVersion: 1

providers:
  - name: audiomonastry
    orgId: 1
    folder: audioMONASTRY
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
