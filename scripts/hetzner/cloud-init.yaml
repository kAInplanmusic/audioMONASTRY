#cloud-config
# =============================================================================
# audioMONASTRY – Hetzner Cloud-Init (Ubuntu 24.04) – high-end production
# -----------------------------------------------------------------------------
# Installiert Docker + Compose + Firewall + Monitoring-Grundlagen auf einer
# frischen Hetzner-Instanz und tuned das System für Echtzeit-Audio/WebRTC:
#   - BBR Congestion Control, große UDP/TCP-Buffer (Mediasoup-SFU)
#   - chrony (präzise Uhr), fail2ban (SSH-Härtung), zram (Build-Headroom)
#   - aria2 + zstd: Werkzeuge des parallelen Medienweges (--via-r2) - damit ist
#     ein frischer Knoten ohne apt-Nachinstallation sofort bedienbar
#   - Docker-Daemon mit hohen File-Limits (WebSockets)
# Wird von scripts/hetzner/provision.py beim Server-Create übergeben.
# =============================================================================
package_update: true
package_upgrade: false
package_reboot_if_required: false

packages:
  - docker.io
  - docker-compose-v2
  - git
  - curl
  - ufw
  - fail2ban
  - chrony
  # Medienweg (2026-09-21): Werkzeuge des PARALLELEN Medienweges.
  # `deliver-media.sh --via-r2` / `parallel-transfer.sh` ziehen das zstd-Archiv
  # mit `aria2c -x16 -s16` und packen es mit `zstd` aus (R2-Zwischenspeicher,
  # lib/r2-node-fetch.sh). Beides fehlte auf einem KALTSTART-Knoten, deshalb
  # installierte der Lauf es per apt nach (`--install-missing`) - ein frischer
  # Knoten war damit erst nach einem Medienlauf vollstaendig nutzbar.
  # Hier steht es EINMALIG in der Provisionierung (package_update/apt laeuft
  # ohnehin genau einmal beim Create): keine Nachinstallation bei jedem Lauf.
  # Der Rueckfall bleibt fuer Knoten aus einem Rollen-SNAPSHOT bestehen - ein
  # Snapshot bootet ohne cloud-init (user_data erreicht nur Kaltstarts), dort
  # installiert r2-node-fetch.sh weiterhin nach, wenn aria2c fehlt.
  - aria2
  - zstd

write_files:
  # F6: oeffentliche IPv4 des Knotens beim Boot ermitteln und ablegen. Der Wert
  # ist die Quelle Nr. 3 der RTC-Verdrahtung (scripts/hetzner/lib/rtc-fleet.sh):
  # primaer fragt der Knoten die Hetzner-Metadata live, diese Datei ist der
  # Fallback, wenn die Metadata (noch) nicht erreichbar ist. Bewusst NICHT
  # `hostname -I`: auf einem Knoten mit Hetzner-Privatnetz ist der erste Treffer
  # die 10.x-Adresse - genau damit kündigte Mediasoup unerreichbare
  # ICE-Kandidaten an, und der Client verband die SFU same-origin (SPA-HTML).
  - path: /usr/local/bin/audiomonastry-node-public-ip.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/sh
      # Schreibt NODE_PUBLIC_IP=<oeffentliche IPv4> nach /etc/audiomonastry-node.conf.
      # Gibt nichts aus und endet immer mit 0 - der Boot darf daran nicht scheitern.
      set -u
      OUT=/etc/audiomonastry-node.conf
      META=http://169.254.169.254/hetzner/v1/metadata
      ip=$(curl -fsS --max-time 8 "$META" 2>/dev/null \
        | sed -n 's/^[[:space:]]*public-ipv4:[[:space:]]*//p' | head -1 | tr -d '"[:space:]')
      if [ -z "${ip:-}" ]; then
        ip=$(curl -fsS --max-time 8 https://api.ipify.org 2>/dev/null | tr -d '[:space:]')
      fi
      case "${ip:-}" in
        ''|10.*|127.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*|169.254.*)
          echo "audiomonastry: oeffentliche IPv4 nicht ermittelbar (${ip:-leer})" >&2
          exit 0 ;;
      esac
      umask 022
      printf 'NODE_PUBLIC_IP=%s\n' "$ip" > "$OUT"
      echo "audiomonastry: NODE_PUBLIC_IP=$ip in $OUT abgelegt"

  - path: /etc/sysctl.d/99-audiomonastry-lowlatency.conf
    permissions: '0644'
    owner: root:root
    content: |
      # audioMONASTRY – Echtzeit-/WebRTC-Tuning für Hetzner-Instanzen
      # SFU (Mediasoup) braucht große UDP-Buffer; Socket.io viele FDs.
      net.core.rmem_default = 262144
      net.core.wmem_default = 262144
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.core.netdev_max_backlog = 65536
      net.core.somaxconn = 8192
      net.core.busy_read = 50
      net.core.busy_poll = 50
      net.ipv4.tcp_rmem = 4096 87380 16777216
      net.ipv4.tcp_wmem = 4096 65536 16777216
      net.ipv4.tcp_congestion_control = bbr
      net.ipv4.tcp_fastopen = 3
      net.ipv4.tcp_slow_start_after_idle = 0
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.ip_local_port_range = 1024 65535
      net.ipv4.udp_rmem_min = 8192
      net.ipv4.udp_wmem_min = 8192
      vm.swappiness = 10
      fs.file-max = 2097152
      fs.inotify.max_user_watches = 524288

  - path: /etc/systemd/system/docker.service.d/00-limits.conf
    permissions: '0644'
    owner: root:root
    content: |
      [Service]
      LimitNOFILE=1048576
      LimitNPROC=infinity
      TasksMax=infinity

runcmd:
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now docker
  - systemctl restart docker
  - systemctl enable --now chrony
  - systemctl enable --now fail2ban
  - apt-get install -y --no-install-recommends zram-tools && systemctl enable --now zramswap || true
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  # RTC-Medienports (INFRA-HETZNER-015, gemessen 2026-09-24).
  #
  # WARUM DAS GEFEHLT HAT: hier standen nur 22/80/443. Der SFU-Knoten laeuft
  # trotzdem - aber nur halb, und die Ursache ist eine Falle:
  #   * mediasoup laeuft als Container mit veroeffentlichten Ports. Docker setzt
  #     eigene iptables-Regeln VOR ufw; die Ports sind deshalb auch bei
  #     geschlossenem ufw erreichbar. Der SFU-Echtpfadtest lief durch (92
  #     RTP-Pakete) - ufw sah nie ein Problem.
  #   * coturn laeuft im NETZWERKMODUS HOST. Es bekommt diese Docker-Ausnahme
  #     NICHT und unterliegt ufw direkt. Ergebnis: 3478 war von aussen zu,
  #     waehrend der Medienpfad daneben funktionierte. Von innen getestet fiel
  #     das nicht auf - erst der Test von einem fremden Rechner zeigte es.
  # Nachgeprueft: /dev/tcp, nc und ein Python-Socket verbinden sich alle drei auf
  # tcp/3478, und ein STUN-Binding-Request ueber udp/3478 bekommt eine gueltige
  # Antwort (40 Bytes) zurueck.
  #
  # BEWUSST EINHEITLICH UND NICHT PRO ROLLE: welcher Knoten SFU ist, entscheidet
  # die Rolle beim Aufbau und kann sich beim naechsten Aufbau aendern. Eine
  # rollenabhaengige Regel waere genau der Schalter, den man vergisst - und dann
  # faellt der Medienpfad still aus. Auf den anderen Knoten kostet es nichts,
  # weil dort nichts auf diesen Ports lauscht.
  #
  # Zweite Schicht bleibt die Hetzner-Firewall (audiomonastry-sfu).
  - ufw allow 3478/udp comment 'TURN UDP'
  - ufw allow 3478/tcp comment 'TURN TCP'
  - ufw allow 49152:49201/udp comment 'TURN Relay'
  - ufw allow 40000:40099/udp comment 'RTC Medien UDP'
  - ufw allow 40000:40099/tcp comment 'RTC Medien TCP'
  - ufw --force enable
  # F6: oeffentliche IP fuer die RTC-Verdrahtung ablegen (siehe write_files oben).
  # Ohne Wert bleibt der Deploy-Pfad bei der Live-Ermittlung (Metadata/ipify) und
  # meldet laut, wenn auch die scheitert.
  - /usr/local/bin/audiomonastry-node-public-ip.sh || true
  # F10 · Namespace-Paritaet: das Deploy-Verzeichnis traegt den kanonischen Namen
  # und existiert ab dem Boot (idempotent). Ohne top-level `name:` leitet
  # `docker compose` den PROJEKTnamen aus dem Verzeichnisnamen ab - ein manueller
  # Aufruf im richtigen Pfad trifft damit dasselbe Projekt wie deploy.sh und der
  # Portal-Worker (die ihn ohnehin explizit als COMPOSE_PROJECT_NAME setzen).
  - mkdir -p /opt/audiomonastry
  - echo "audiomonastry cloud-init done" > /root/.audiomonastry-bootstrap-done
