# Prometheus-Konfiguration für sampleMONK (Hetzner-Knoten)
# Wird von docker-compose.monitoring.yml gemountet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

# Prometheus-Alerts werden an Alertmanager weitergereicht (Chat-Webhook).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # sampleMONK-App-Metriken (server.ts liefert /api/metrics?format=prometheus).
  # PROD-P0-001: der Server verlangt fuer Lese-Metriken das SCRAPE_TOKEN
  # (Authorization: Bearer). Ohne Token bleibt die Route fail-closed.
  #
  # PROD-P1-004 (Befund 2026-09-18): Prometheus expandiert Umgebungsvariablen in
  # der Konfiguration NICHT - auch nicht mit dem frueher hier gesetzten Flag
  # `--config.expand-env`, das es gar nicht gibt (Prometheus brach damit schon
  # beim Start ab, der ganze Stack lief in eine Restart-Schleife). Der Platzhalter
  # `__SCRAPE_TOKEN__` wird deshalb beim Containerstart vom Entrypoint der Compose-
  # Datei ersetzt (siehe docker-compose.monitoring.yml, Abschnitt prometheus).
  - job_name: 'samplemonk'
    metrics_path: /api/metrics
    params:
      format: ['prometheus']
    scheme: http
    authorization:
      type: Bearer
      credentials: '__SCRAPE_TOKEN__'
    static_configs:
      - targets: ['sample-monk:8080']

  # Cross-Host-Scrape, falls der Monitoring-Knoten NICHT auf dem App-Knoten
  # läuft (z. B. edge-1). Domain anpassen:
  # - job_name: 'samplemonk-public'
  #   metrics_path: /api/metrics
  #   params:
  #     format: ['prometheus']
  #   scheme: https
  #   static_configs:
  #     - targets: ['anunnakitools.de']
