# Prometheus-Konfiguration für sampleMONK (Hetzner-Knoten)
# Wird von docker-compose.monitoring.yml gemountet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

# Prometheus-Alerts werden an Alertmanager weitergereicht (Chat-Webhook).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # sampleMONK-App-Metriken (server.ts liefert /api/metrics?format=prometheus)
  - job_name: 'samplemonk'
    metrics_path: /api/metrics
    params:
      format: ['prometheus']
    scheme: http
    static_configs:
      - targets: ['sample-monk:8080']

  # Cross-Host-Scrape, falls der Monitoring-Knoten NICHT auf dem App-Knoten
  # läuft (z. B. edge-1). Domain anpassen:
  # - job_name: 'samplemonk-public'
  #   metrics_path: /api/metrics
  #   params:
  #     format: ['prometheus']
  #   scheme: https
  #   static_configs:
  #     - targets: ['anunnakitools.de']
