# Prometheus-Konfiguration für audioMONASTRY (Hetzner-Knoten)
# Wird von docker-compose.monitoring.yml gemountet.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts.yml'

# Prometheus-Alerts werden an Alertmanager weitergereicht (Chat-Webhook).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # audioMONASTRY-App-Metriken (server.ts liefert /api/metrics?format=prometheus).
  # PROD-P0-001: der Server verlangt fuer Lese-Metriken das SCRAPE_TOKEN
  # (Authorization: Bearer). Ohne Token bleibt die Route fail-closed.
  #
  # PROD-P1-004 (Befund 2026-09-18): Prometheus expandiert Umgebungsvariablen in
  # der Konfiguration NICHT - auch nicht mit dem frueher hier gesetzten Flag
  # `--config.expand-env`, das es gar nicht gibt (Prometheus brach damit schon
  # beim Start ab, der ganze Stack lief in eine Restart-Schleife). Die Platzhalter
  # `__SCRAPE_TOKEN__`, `__APP_TARGET__` und `__APP_SCHEME__` werden deshalb beim
  # Containerstart vom Entrypoint der Compose-Datei ersetzt (siehe
  # docker-compose.monitoring.yml, Abschnitt prometheus).
  #
  # INFRA-HETZNER-004: Ziel ist die PRODUKTIONS-App (app-1), NICHT der lokale
  # Container im edge-Compose-Netz. Der Monitoring-Stack laeuft auf edge-1 und
  # hat dort keinen App-Container; `audiomonastry:8080` war deshalb nicht die
  # Produktion, sondern die edge-eigene Kopie (bzw. gar nichts).
  #     Default (Flotte):  APP_TARGET=anunnakitools.de  APP_SCHEME=https
  #                        -> ueber Floating-IP/DNS, also app-1 selbst
  #     Lokal (edge-only, Monitoring neben der App gestartet):
  #                        APP_TARGET=audiomonastry:8080  APP_SCHEME=http
  - job_name: 'audiomonastry'
    metrics_path: /api/metrics
    params:
      format: ['prometheus']
    scheme: __APP_SCHEME__
    authorization:
      type: Bearer
      credentials: '__SCRAPE_TOKEN__'
    static_configs:
      - targets: ['__APP_TARGET__']

